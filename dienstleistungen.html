["ICS series","Serie ICS","Série ICS","ICS 系列"],"Stand {d}":["As of {d}","Estado: {d}","État : {d}","截至 {d}"],"Überblick":["Overview","Vista general","Aperçu","概览"],"Schieder":["Schieder","Schieder","Schieder","Schieder"],"Serie EH":["EH series","Serie EH","Série EH","EH 系列"],"Bereich":["Area","Área","Domaine","领域"],"Einkauf":["Purchasing","Compras","Achats","采购"],"Seite ↗":["Page ↗","Página ↗","Page ↗","页面 ↗"],"Termine":["Dates","Fechas","Dates","日期"],"1 Std.":["1 hr","1 h","1 h","1 小时"],"Filter":["Filter","Filtro","Filtre","筛选"],"Normen":["Standards","Normas","Normes","标准"],"1 Tag":["1 day","1 día","1 jour","1 天"],"Der STARTER-Tag vermittelt an einem Tag einen schnellen, fundierten Überblick über die CE-Kennzeichnung – vor dem Hintergrund der neuen Maschinenverordnung und der geänderten Normen EN ISO 13849-1 und EN 62061. Teil 1 (Knowledgeloading) fasst zentrales Wissen kompakt zusammen, Teil 2 (Workshop) behandelt die konkreten Fragestellungen und Anwendungsfälle des Kunden. Die Schwerpunkte werden für Maschinenhersteller bzw. Schaltschrankbauer individuell festgelegt. Ergebnis sind Handlungsempfehlungen und Lösungsansätze für den eigenen Start. Durchführung online, beim Kunden vor Ort oder an einem Phoenix Contact Standort; Preis ab 999 EUR je Veranstaltung.":["The STARTER day provides a fast, well-founded overview of CE marking in one day – against the background of the new Machinery Regulation and the revised standards EN ISO 13849-1 and EN 62061. Part 1 (knowledge loading) summarizes key knowledge compactly; Part 2 (workshop) addresses the customer's specific questions and use cases. The focus areas are defined individually for machine builders or control cabinet builders. The result is recommendations for action and solution approaches for getting started. Held online, on site at the customer or at a Phoenix Contact location; price from 999 EUR per event.","El día STARTER ofrece en un solo día una visión general rápida y fundamentada del marcado CE, en el contexto del nuevo Reglamento de Máquinas y de las normas modificadas EN ISO 13849-1 y EN 62061. La parte 1 (Knowledgeloading) resume de forma compacta los conocimientos clave; la parte 2 (taller) aborda las cuestiones y casos de aplicación concretos del cliente. Los temas principales se definen de forma individual para fabricantes de máquinas o constructores de armarios de control. El resultado son recomendaciones de actuación y propuestas de solución para el propio inicio. Se realiza online, en las instalaciones del cliente o en una sede de Phoenix Contact; precio desde 999 EUR por evento.","La journée STARTER offre en une journée un aperçu rapide et solide du marquage CE – dans le contexte du nouveau règlement Machines et des normes révisées EN ISO 13849-1 et EN 62061. La partie 1 (Knowledgeloading) résume les connaissances essentielles de manière compacte, la partie 2 (atelier) traite les questions et cas d'application concrets du client. Les priorités sont définies individuellement pour les constructeurs de machines ou les fabricants d'armoires électriques. Le résultat : des recommandations d'action et des pistes de solution pour bien démarrer. Réalisation en ligne, sur site chez le client ou sur un site Phoenix Contact ; prix à partir de 999 EUR par session.","STARTER日在一天内快速、扎实地概述CE标志——以新版《机械法规》以及修订后的EN ISO 13849-1和EN 62061标准为背景。第1部分（知识导入）简明汇总核心知识，第2部分（研讨会）处理客户的具体问题和应用案例。重点内容针对机器制造商或控制柜制造商单独确定。成果为行动建议和启动所需的解决思路。可在线进行、在客户现场或在Phoenix Contact所在地举办；每场价格999 EUR起。"],"Kunden können Komponenten konfektionieren lassen, vorgefertigte Varianten nutzen oder eigene erstellen; auch umfassende Konfektionierungsdienstleistungen inklusive Markierung und Anschaltkästen mit Überspannungsschutz sind möglich. Wege: über Konfiguratoren (z. B. Schaltschrankbau, Verbindungstechnik, Stromversorgungen), über „Konfigurieren“ auf der Artikeldetailseite (Kabellängen, Anschlusstechnik, direkt in den Warenkorb) oder per individueller Anfrage. Dazu gehören auch kundenspezifische Kabelkonfektionen, Leiterplattenanschlüsse und Elektronikgehäuse.":["Customers can have components assembled, use pre-assembled variants or create their own; comprehensive assembly services including marking and junction boxes with surge protection are also available. Options: via configurators (e.g. control cabinet building, connection technology, power supplies), via “Configure” on the product detail page (cable lengths, connection technology, directly into the cart) or by individual request. This also includes customer-specific cable assemblies, PCB connections and electronics housings.","Los clientes pueden encargar el ensamblaje de componentes, utilizar variantes prefabricadas o crear las suyas propias; también es posible contratar servicios de ensamblaje completos, incluido el marcado y cajas de conexión con protección contra sobretensiones. Vías: mediante configuradores (p. ej. construcción de armarios de control, tecnología de conexión, fuentes de alimentación), mediante «Configurar» en la página de detalle del artículo (longitudes de cable, tecnología de conexión, directamente al carrito) o mediante solicitud individual. Esto incluye también confección de cables, conexiones para placas de circuito impreso y cajas para electrónica personalizadas.","Les clients peuvent faire assembler des composants, utiliser des variantes préconfectionnées ou créer les leurs ; des services d'assemblage complets, y compris le marquage et des boîtiers de raccordement avec protection contre les surtensions, sont également possibles. Moyens : via les configurateurs (p. ex. construction d'armoires électriques, connectique, alimentations), via « Configurer » sur la page de détail de l'article (longueurs de câble, technique de raccordement, directement dans le panier) ou sur demande individuelle. Cela comprend aussi les câbles confectionnés, les connexions pour circuits imprimés et les boîtiers électroniques sur mesure.","客户可委托组装元件、使用预制型号或自行创建；也可提供包括标记和带浪涌保护的接线盒在内的全面组装服务。途径：通过配置器（如控制柜制造、连接技术、电源），通过产品详情页上的“配置”（电缆长度、连接技术，直接加入购物车），或通过个性化询价。其中还包括客户定制的电缆组件、PCB连接件和电子外壳。"],"Die APIs geben Entwicklerinnen und Entwicklern sicheren, konsistenten Zugang zu denselben Daten wie auf den Produktdetailseiten. Die Product Commercial API liefert Verfügbarkeit, Preis und Lieferinformationen; die Product Information API allgemeine und technische Daten, Klassifizierungen, Zulassungen, Deklarationen und Zertifikate. Die AAS API stellt Produktinformationen nach IEC 63278-1 bereit, auch für gefertigte Produktinstanzen mit Identification-Link (IEC 61406-1). Die Anbindung erfolgt über das API-Entwicklerportal.":["The APIs give developers secure, consistent access to the same data as on the product detail pages. The Product Commercial API provides availability, price and delivery information; the Product Information API provides general and technical data, classifications, approvals, declarations and certificates. The AAS API provides product information according to IEC 63278-1, also for manufactured product instances with an identification link (IEC 61406-1). Connection is via the API developer portal.","Las API ofrecen a los desarrolladores un acceso seguro y coherente a los mismos datos que en las páginas de detalle de producto. La Product Commercial API proporciona disponibilidad, precio e información de entrega; la Product Information API, datos generales y técnicos, clasificaciones, homologaciones, declaraciones y certificados. La AAS API proporciona información de producto según IEC 63278-1, también para instancias de producto fabricadas con Identification-Link (IEC 61406-1). La conexión se realiza a través del portal para desarrolladores de API.","Les API offrent aux développeurs un accès sécurisé et cohérent aux mêmes données que sur les pages de détail produit. La Product Commercial API fournit la disponibilité, le prix et les informations de livraison ; la Product Information API, les données générales et techniques, les classifications, homologations, déclarations et certificats. L'AAS API fournit des informations produit selon IEC 63278-1, y compris pour des instances de produits fabriqués avec Identification-Link (IEC 61406-1). La connexion s'effectue via le portail développeurs API.","这些API为开发人员提供安全、一致的访问方式，可获取与产品详情页相同的数据。Product Commercial API提供供货情况、价格和交货信息；Product Information API提供一般数据和技术数据、分类、认证、声明和证书。AAS API按照IEC 63278-1提供产品信息，也适用于带有Identification-Link（IEC 61406-1）的已生产产品实例。通过API开发者门户进行对接。"],"Phoenix Contact unterstützt Fachplaner bei nachhaltigen, individuellen Planungskonzepten und der integralen Gebäudeplanung. Ein Leistungsportfolio entlang der Leistungsphasen der VDI 3814 erläutert auch Normen wie IEC 62443 und DIN EN 15232-2. Das Planungshandbuch enthält Grundlagen zur Gebäudemanagementsoftware Emalytics, Protokollen, Produkten, Schulungen und zur Dekarbonisierungslösung. Ausschreibungstexte stehen auf ausschreiben.de bereit; ergänzt durch Konfiguratoren, Kataloge und Seminare.":["Phoenix Contact supports specialist planners with sustainable, individual planning concepts and integrated building planning. A service portfolio along the service phases of VDI 3814 also explains standards such as IEC 62443 and DIN EN 15232-2. The planning manual contains fundamentals on the Emalytics building management software, protocols, products, training and the decarbonization solution. Tender texts are available on ausschreiben.de, complemented by configurators, catalogs and seminars.","Phoenix Contact ayuda a los proyectistas especializados con conceptos de planificación sostenibles e individuales y con la planificación integral de edificios. Una cartera de servicios a lo largo de las fases de servicio de la VDI 3814 explica también normas como IEC 62443 y DIN EN 15232-2. El manual de planificación contiene fundamentos sobre el software de gestión de edificios Emalytics, protocolos, productos, formaciones y la solución de descarbonización. Los textos de licitación están disponibles en ausschreiben.de, complementados con configuradores, catálogos y seminarios.","Phoenix Contact accompagne les bureaux d'études dans des concepts de planification durables et personnalisés et dans la conception intégrée des bâtiments. Un portefeuille de prestations suivant les phases de la VDI 3814 explique également des normes telles que IEC 62443 et DIN EN 15232-2. Le manuel de planification contient les bases du logiciel de gestion technique du bâtiment Emalytics, des protocoles, produits, formations et de la solution de décarbonation. Les textes d'appel d'offres sont disponibles sur ausschreiben.de, complétés par des configurateurs, catalogues et séminaires.","Phoenix Contact为专业规划人员提供可持续、个性化的规划方案和一体化建筑规划支持。依据VDI 3814各服务阶段的服务组合还对IEC 62443和DIN EN 15232-2等标准进行了说明。规划手册包含楼宇管理软件Emalytics、通信协议、产品、培训及脱碳解决方案的基础知识。招标文本可在ausschreiben.de获取，并辅以配置器、产品目录和研讨会。"],"Für Kunden mit einer ungefähren Vorstellung, aber ohne konkreten Umsetzungsweg, analysiert das Solution Center die Applikation, definiert Maßnahmen und leitet ein Lösungskonzept ab. Dazu gehören Beratung bei der Spezifikation, Pflichtenheft, Know-how-Transfer und Zulassungsmanagement inklusive Prüfungen. In Entwicklung und Lieferung sind u. a. CAD-Modelle, Zeichnungen, Muster, Prüfungen, Design-in-Support, Überspannungs- und EMC-Schutz sowie EPLAN-Makros inbegriffen.":["For customers with a rough idea but no concrete implementation path, the Solution Center analyzes the application, defines measures and derives a solution concept. This includes advice on the specification, requirements specification, know-how transfer and approval management including testing. Development and delivery include, among other things, CAD models, drawings, samples, testing, design-in support, surge and EMC protection, and EPLAN macros.","Para clientes con una idea aproximada pero sin una vía de implementación concreta, el Solution Center analiza la aplicación, define medidas y deriva un concepto de solución. Esto incluye asesoramiento en la especificación, pliego de condiciones, transferencia de conocimientos y gestión de homologaciones, incluidas las pruebas. En el desarrollo y el suministro se incluyen, entre otros, modelos CAD, planos, muestras, pruebas, soporte design-in, protección contra sobretensiones y EMC, así como macros EPLAN.","Pour les clients ayant une idée approximative mais pas de voie de mise en œuvre concrète, le Solution Center analyse l'application, définit des mesures et en déduit un concept de solution. Cela comprend le conseil sur la spécification, le cahier des charges, le transfert de savoir-faire et la gestion des homologations, essais compris. Le développement et la livraison incluent notamment des modèles CAO, plans, échantillons, essais, un support design-in, la protection contre les surtensions et CEM ainsi que des macros EPLAN.","对于已有大致想法但缺乏具体实施路径的客户，Solution Center会分析应用、确定措施并推导出解决方案概念。其中包括规格说明咨询、技术规范书、技术转让以及包括测试在内的认证管理。开发和交付内容包括CAD模型、图纸、样品、测试、Design-in支持、浪涌和EMC防护以及EPLAN宏等。"],"Für den Geräteanschluss lassen sich Leiterplattenklemmen und -steckverbinder individuell anpassen – Farbe, Bedruckung und Kodierung sind frei wählbar. Modulare SPT-Klemmen erhalten nach der Konfiguration automatisch eine individuelle Artikelnummer und Lieferzeit und können direkt in den Warenkorb gelegt werden. Für Grundleisten und Board-to-Board-Steckverbinder werden Polzahl, Länge, Steckverbinder und Zugentlastung gewählt und in 3D dargestellt.":["For device connection, PCB terminal blocks and connectors can be customized – color, printing and coding are freely selectable. After configuration, modular SPT terminal blocks automatically receive an individual item number and delivery time and can be added directly to the cart. For base strips and board-to-board connectors, the number of positions, length, connector and strain relief are selected and displayed in 3D.","Para la conexión de equipos, los bornes y conectores para placa de circuito impreso pueden adaptarse individualmente: color, impresión y codificación se pueden elegir libremente. Tras la configuración, los bornes modulares SPT reciben automáticamente un código de artículo individual y un plazo de entrega, y pueden añadirse directamente al carrito. Para regletas base y conectores board-to-board se seleccionan número de polos, longitud, conector y alivio de tracción, y se representan en 3D.","Pour le raccordement d'appareils, les borniers et connecteurs pour circuits imprimés peuvent être personnalisés – couleur, impression et détrompage au choix. Après configuration, les borniers modulaires SPT reçoivent automatiquement une référence et un délai de livraison individuels et peuvent être ajoutés directement au panier. Pour les embases et connecteurs board-to-board, le nombre de pôles, la longueur, le connecteur et le serre-câble sont sélectionnés et représentés en 3D.","用于设备连接的PCB接线端子和连接器可个性化定制——颜色、印刷和编码均可自由选择。模块化SPT端子在配置完成后会自动获得独立的订货号和交货期，并可直接加入购物车。对于基座和板对板连接器，可选择位数、长度、连接器和应力消除装置，并以3D方式显示。"],"Das Komplettpaket enthält alle Leistungen, um eine Produktion maximal abzusichern. Phoenix Contact begleitet vom STARTER-Workshop über Bestandsaufnahme, Schutzbedarfs-, Bedrohungs- und Risikoanalyse bis zum Security-Konzept, dessen Implementierung und Verifikation. Anschließend folgen zyklische Prüfungen. Für alle Prozessschritte erhält der Kunde eine umfassende Dokumentation; Beratung und Coaching der Mitarbeitenden sind enthalten.":["The complete package contains all services needed to secure production to the maximum. Phoenix Contact provides support from the STARTER workshop through inventory, protection requirements, threat and risk analysis to the security concept, its implementation and verification. Cyclical audits follow. The customer receives comprehensive documentation for all process steps; consulting and coaching of employees are included.","El paquete completo incluye todos los servicios para proteger la producción al máximo. Phoenix Contact acompaña desde el taller STARTER, pasando por el inventario y los análisis de necesidades de protección, amenazas y riesgos, hasta el concepto de seguridad, su implementación y verificación. A continuación se realizan revisiones periódicas. El cliente recibe una documentación completa de todos los pasos del proceso; incluye asesoramiento y coaching de los empleados.","Le pack complet comprend toutes les prestations pour sécuriser au maximum une production. Phoenix Contact accompagne de l'atelier STARTER à l'état des lieux, à l'analyse des besoins de protection, des menaces et des risques, jusqu'au concept de sécurité, sa mise en œuvre et sa vérification. Des contrôles périodiques suivent. Le client reçoit une documentation complète pour toutes les étapes ; le conseil et le coaching des collaborateurs sont inclus.","整体套餐包含最大限度保护生产所需的全部服务。Phoenix Contact提供全程陪伴：从STARTER研讨会、现状盘点、防护需求分析、威胁与风险分析，到安全方案及其实施和验证。随后进行周期性检查。客户可获得所有流程步骤的完整文档，并包含员工咨询和辅导。"],"Experten aus dem Engineering vermitteln im Basic Workshop eine allgemeine Systemübersicht über PLCnext Technology und die ersten Schritte mit der Entwicklungsumgebung PLCnext Engineer. Der Workshop dauert 4 Stunden, findet für bis zu 8 Personen als Microsoft-Teams-Meeting statt und kostet 1.349,00 Euro zzgl. MwSt. Auf Anfrage ist die Durchführung auch vor Ort oder an einem Phoenix Contact Standort möglich (Reisekosten separat).":["In the Basic Workshop, engineering experts provide a general system overview of PLCnext Technology and the first steps with the PLCnext Engineer development environment. The workshop lasts 4 hours, is held for up to 8 people as a Microsoft Teams meeting and costs 1,349.00 euros plus VAT. On request, it can also be held on site or at a Phoenix Contact location (travel costs extra).","En el Basic Workshop, expertos de ingeniería ofrecen una visión general del sistema PLCnext Technology y los primeros pasos con el entorno de desarrollo PLCnext Engineer. El taller dura 4 horas, se realiza para hasta 8 personas como reunión de Microsoft Teams y cuesta 1.349,00 euros más IVA. Bajo petición también puede realizarse in situ o en una sede de Phoenix Contact (gastos de viaje aparte).","Lors du Basic Workshop, des experts en ingénierie présentent une vue d'ensemble du système PLCnext Technology et les premiers pas avec l'environnement de développement PLCnext Engineer. L'atelier dure 4 heures, se déroule pour 8 personnes maximum en réunion Microsoft Teams et coûte 1 349,00 euros HT. Sur demande, il peut aussi avoir lieu sur site ou sur un site Phoenix Contact (frais de déplacement en sus).","在Basic Workshop中，工程专家将介绍PLCnext Technology的系统概况以及开发环境PLCnext Engineer的入门操作。研讨会时长4小时，以Microsoft Teams会议形式举行，最多8人参加，费用为1,349.00欧元（不含增值税）。如有需要，也可在现场或Phoenix Contact所在地举办（差旅费另计）。"],"Für das Leiterplatten-Design stehen auf der Produktdetailseite unter „3D-Ansicht und Download“ ECAD-Daten für die verbreitetsten EDA-Tools bereit, z. B. Altium Designer, Eagle, KiCad, OrCAD, Allegro, Pads und ZUKEN. Die Daten werden über die Partner SamacSys und SnapMagic angeboten und sind auch bei Distributoren wie DigiKey, Mouser oder Farnell zu finden. Plug-ins ermöglichen die direkte Integration in Altium und Eagle.":["For PCB design, ECAD data for the most common EDA tools, e.g. Altium Designer, Eagle, KiCad, OrCAD, Allegro, Pads and ZUKEN, is available on the product detail page under “3D view and download”. The data is offered via the partners SamacSys and SnapMagic and can also be found at distributors such as DigiKey, Mouser or Farnell. Plug-ins enable direct integration into Altium and Eagle.","Para el diseño de placas de circuito impreso, en la página de detalle del producto, en «Vista 3D y descarga», hay datos ECAD para las herramientas EDA más comunes, p. ej. Altium Designer, Eagle, KiCad, OrCAD, Allegro, Pads y ZUKEN. Los datos se ofrecen a través de los socios SamacSys y SnapMagic y también se encuentran en distribuidores como DigiKey, Mouser o Farnell. Los plug-ins permiten la integración directa en Altium y Eagle.","Pour la conception de circuits imprimés, des données ECAD pour les outils EDA les plus courants, p. ex. Altium Designer, Eagle, KiCad, OrCAD, Allegro, Pads et ZUKEN, sont disponibles sur la page de détail produit sous « Vue 3D et téléchargement ». Les données sont proposées via les partenaires SamacSys et SnapMagic et se trouvent aussi chez des distributeurs comme DigiKey, Mouser ou Farnell. Des plug-ins permettent l'intégration directe dans Altium et Eagle.","用于PCB设计的ECAD数据可在产品详情页的“3D视图和下载”中获取，支持最常用的EDA工具，例如Altium Designer、Eagle、KiCad、OrCAD、Allegro、Pads和ZUKEN。数据通过合作伙伴SamacSys和SnapMagic提供，也可在DigiKey、Mouser或Farnell等分销商处找到。插件可实现与Altium和Eagle的直接集成。"],"Die FAQ erklären u. a., warum Preise nur für autorisierte Benutzende sichtbar sind und wie nach der Registrierung eine Kundennummer angefragt wird. Außerdem wird beschrieben, wie erweiterte Bestellberechtigungen über „Mein Phoenix Contact“ beantragt werden und welche Schritte nötig sind, um eigene Artikelnummern in Suche, Listen und Warenkorb zu nutzen. Für weitere Anliegen verweist die Seite auf die Kontaktseite.":["The FAQ explains, among other things, why prices are only visible to authorized users and how to request a customer number after registration. It also describes how to apply for extended ordering permissions via “Mein Phoenix Contact” and what steps are needed to use your own item numbers in search, lists and the cart. For other inquiries, the page refers to the contact page.","Las preguntas frecuentes explican, entre otras cosas, por qué los precios solo son visibles para usuarios autorizados y cómo solicitar un número de cliente tras el registro. También se describe cómo solicitar permisos de pedido ampliados a través de «Mein Phoenix Contact» y qué pasos son necesarios para utilizar códigos de artículo propios en la búsqueda, las listas y el carrito. Para otras consultas, la página remite a la página de contacto.","La FAQ explique notamment pourquoi les prix ne sont visibles que pour les utilisateurs autorisés et comment demander un numéro client après l'inscription. Elle décrit également comment demander des droits de commande étendus via « Mein Phoenix Contact » et quelles étapes sont nécessaires pour utiliser ses propres références dans la recherche, les listes et le panier. Pour toute autre demande, la page renvoie à la page de contact.","常见问题解答说明了为何价格仅对授权用户可见，以及注册后如何申请客户编号等内容。此外还介绍了如何通过“Mein Phoenix Contact”申请扩展订购权限，以及在搜索、清单和购物车中使用自有物料号所需的步骤。其他问题请参阅联系页面。"],"Das Komplettpaket begleitet Industrieunternehmen in allen Phasen – von Beratung und Status-quo-Analyse über Strategie- und Konzeptentwicklung und Schulung der Mitarbeitenden bis zur Realisierung. Gefährdungen werden aufgedeckt, analysiert und beseitigt, Anforderungen etwa aus BetrSichV und Maschinenrichtlinie werden berücksichtigt. Die Absicherung wird dynamisch an betriebliche Veränderungen angepasst.":["The complete package supports industrial companies in all phases – from consulting and status quo analysis through strategy and concept development and employee training to implementation. Hazards are identified, analyzed and eliminated, and requirements from e.g. the German Ordinance on Industrial Safety and Health (BetrSichV) and the Machinery Directive are taken into account. Protection is dynamically adapted to operational changes.","El paquete completo acompaña a las empresas industriales en todas las fases: desde el asesoramiento y el análisis de la situación actual, pasando por el desarrollo de estrategias y conceptos y la formación de los empleados, hasta la implementación. Se detectan, analizan y eliminan los peligros, y se tienen en cuenta requisitos como los de la BetrSichV y la Directiva de Máquinas. La protección se adapta dinámicamente a los cambios operativos.","Le pack complet accompagne les entreprises industrielles dans toutes les phases – du conseil et de l'analyse de l'existant au développement de la stratégie et du concept, à la formation des collaborateurs et jusqu'à la réalisation. Les dangers sont identifiés, analysés et éliminés, les exigences issues par exemple de la BetrSichV et de la directive Machines sont prises en compte. La protection est adaptée de manière dynamique aux évolutions de l'exploitation.","整体套餐在所有阶段为工业企业提供支持——从咨询和现状分析、战略与方案制定、员工培训直至实施。识别、分析并消除危险，同时考虑《德国工业安全与健康条例》（BetrSichV）和《机械指令》等要求。防护措施会根据企业运营变化进行动态调整。"],"Ist ein Artikel als Muster verfügbar, findet sich auf der Produktdetailseite oben rechts das Bestellformular. Nach Registrierung bzw. Login wird das Formular ausgefüllt und abgeschickt; eine Bestellbestätigung kommt per E-Mail. Bei Bestelleingang an einem Werktag bis 14 Uhr erfolgt der Versand in der Regel noch am selben Tag. Ohne Musterhinweis ist der lokale Vertrieb Ansprechpartner.":["If an item is available as a sample, the order form can be found at the top right of the product detail page. After registering or logging in, fill out and submit the form; an order confirmation is sent by email. Orders received on a working day by 2 p.m. are usually shipped the same day. If there is no sample note, the local sales office is the contact.","Si un artículo está disponible como muestra, el formulario de pedido se encuentra arriba a la derecha en la página de detalle del producto. Tras registrarse o iniciar sesión, se rellena y envía el formulario; la confirmación del pedido llega por correo electrónico. Si el pedido se recibe en un día laborable antes de las 14:00 h, normalmente se envía el mismo día. Si no hay indicación de muestra, la persona de contacto es el departamento de ventas local.","Si un article est disponible en échantillon, le formulaire de commande se trouve en haut à droite de la page de détail produit. Après inscription ou connexion, le formulaire est rempli et envoyé ; une confirmation de commande arrive par e-mail. Pour toute commande reçue un jour ouvré avant 14 h, l'expédition a généralement lieu le jour même. En l'absence de mention d'échantillon, contactez le service commercial local.","如果某物料提供样品，可在产品详情页右上角找到订购表单。注册或登录后填写并提交表单，订单确认将通过电子邮件发送。工作日14点前收到的订单通常当天发货。如无样品提示，请联系当地销售部门。"],"Die Seminare vermitteln praxisnahes Wissen zu den Anforderungen aus CRA, NIS2, B3S und IEC 62443 sowie zu robusten Netzwerken. Sie richten sich an Betreiber, Integratoren und Hersteller von Maschinen und Anlagen. Das Angebot umfasst Webinare, Geschäftsleitungsschulungen und das TÜV Rheinland Cyber Security Training Program; Inhouse-Durchführung und Consulting sind möglich.":["The seminars provide practical knowledge of the requirements from CRA, NIS2, B3S and IEC 62443 as well as robust networks. They are aimed at operators, integrators and manufacturers of machines and systems. The offering includes webinars, management training and the TÜV Rheinland Cyber Security Training Program; in-house delivery and consulting are possible.","Los seminarios transmiten conocimientos prácticos sobre los requisitos de CRA, NIS2, B3S e IEC 62443, así como sobre redes robustas. Están dirigidos a operadores, integradores y fabricantes de máquinas e instalaciones. La oferta incluye webinars, formaciones para la dirección y el TÜV Rheinland Cyber Security Training Program; es posible la realización in company y la consultoría.","Les séminaires transmettent des connaissances pratiques sur les exigences du CRA, de NIS2, du B3S et de l'IEC 62443 ainsi que sur les réseaux robustes. Ils s'adressent aux exploitants, intégrateurs et fabricants de machines et d'installations. L'offre comprend des webinaires, des formations pour la direction et le TÜV Rheinland Cyber Security Training Program ; la réalisation en intra et le conseil sont possibles.","研讨会传授有关CRA、NIS2、B3S和IEC 62443要求以及稳健网络的实用知识，面向机器和设备的运营方、集成商和制造商。课程包括网络研讨会、管理层培训以及TÜV Rheinland Cyber Security Training Program；也可提供企业内训和咨询。"],"Mit den EDI-Services werden Bestellungen vollständig automatisiert und in hoher Qualität direkt in das Phoenix Contact-System übertragen. Bestell-, Liefer- und Rechnungsdaten werden elektronisch ausgetauscht, das Warenwirtschaftssystem wird direkt angebunden. Ansprechpartner für die Teilnahme ist der E-Business-Support (support-ebusiness@phoenixcontact.de).":["With the EDI services, orders are fully automated and transferred in high quality directly into the Phoenix Contact system. Order, delivery and invoice data is exchanged electronically, and the merchandise management system is connected directly. The contact for participation is E-Business Support (support-ebusiness@phoenixcontact.de).","Con los servicios EDI, los pedidos se automatizan por completo y se transfieren con alta calidad directamente al sistema de Phoenix Contact. Los datos de pedido, entrega y factura se intercambian electrónicamente y el sistema de gestión de mercancías se conecta directamente. La persona de contacto para participar es el soporte de E-Business (support-ebusiness@phoenixcontact.de).","Grâce aux services EDI, les commandes sont entièrement automatisées et transmises avec une grande qualité directement dans le système Phoenix Contact. Les données de commande, de livraison et de facturation sont échangées électroniquement, le système de gestion des stocks est connecté directement. L'interlocuteur pour la participation est le support E-Business (support-ebusiness@phoenixcontact.de).","借助EDI服务，订单可实现完全自动化，并以高质量直接传输至Phoenix Contact系统。订单、交货和发票数据以电子方式交换，商品管理系统直接对接。参与事宜请联系电子商务支持（support-ebusiness@phoenixcontact.de）。"],"Passen die angebotenen Termine oder Themen nicht, teilen Kunden ihre Anforderungen und Wünsche über das Anfrageformular mit und erhalten ein passendes Angebot. Alle Seminare der Kategorien können als individuell angepasste Inhouse-Veranstaltung durchgeführt werden. Auch für CE-Kennzeichnung und Arbeitssicherheit werden maßgeschneiderte Seminare angeboten.":["If the dates or topics offered do not fit, customers can share their requirements and wishes via the request form and receive a suitable offer. All seminars in the categories can be held as individually tailored in-house events. Tailored seminars are also offered for CE marking and occupational safety.","Si las fechas o los temas ofrecidos no encajan, los clientes comunican sus requisitos y deseos a través del formulario de solicitud y reciben una oferta adecuada. Todos los seminarios de las categorías pueden realizarse como evento in company adaptado individualmente. También se ofrecen seminarios a medida para el marcado CE y la seguridad laboral.","Si les dates ou thèmes proposés ne conviennent pas, les clients communiquent leurs exigences et souhaits via le formulaire de demande et reçoivent une offre adaptée. Tous les séminaires des catégories peuvent être organisés en intra sur mesure. Des séminaires sur mesure sont également proposés pour le marquage CE et la sécurité au travail.","如果所提供的日期或主题不合适，客户可通过询价表单提交需求和意向，并获得相应报价。各类别的所有研讨会均可作为量身定制的企业内训举办。此外还提供CE标志和职业安全方面的定制研讨会。"],"Zur Optimierung der Produktionsprozesse fertigt Phoenix Contact Tragschienen nach Kundenspezifikation vor. Die Konstruktion erfolgt einfach mit clipx ENGINEER. Es gelten definierte Spezifikationen, z. B. Maßtoleranzen von ±0,5 mm, Mindestlängen von >20 mm (unperforiert) bzw. >100 mm (perforiert) und letzte Stanzung <1750 mm.":["To optimize production processes, Phoenix Contact pre-assembles DIN rails to customer specifications. Design is easy with clipx ENGINEER. Defined specifications apply, e.g. dimensional tolerances of ±0.5 mm, minimum lengths of >20 mm (unperforated) or >100 mm (perforated) and last punching <1750 mm.","Para optimizar los procesos de producción, Phoenix Contact prefabrica carriles según las especificaciones del cliente. El diseño se realiza fácilmente con clipx ENGINEER. Se aplican especificaciones definidas, p. ej. tolerancias dimensionales de ±0,5 mm, longitudes mínimas de >20 mm (sin perforar) o >100 mm (perforado) y último punzonado <1750 mm.","Pour optimiser les processus de production, Phoenix Contact préconfectionne des profilés selon les spécifications du client. La conception se fait facilement avec clipx ENGINEER. Des spécifications définies s'appliquent, p. ex. tolérances dimensionnelles de ±0,5 mm, longueurs minimales de >20 mm (non perforé) ou >100 mm (perforé) et dernier poinçonnage <1750 mm.","为优化生产流程，Phoenix Contact可按客户规格预制DIN导轨。使用clipx ENGINEER即可轻松设计。适用既定规格，例如尺寸公差±0.5 mm、最小长度>20 mm（无孔）或>100 mm（带孔），最后一个冲孔<1750 mm。"],"Das Energiemonitoring-System wird aus passenden Messgeräten und Zubehör zusammengestellt und kommt als Einheit mit Edge-PC, Energiemanagement-Software und allen notwendigen Komponenten. Für das Gebäudemanagementsystem Emalytics werden Controller, Supervisor, Datenpunkte und Funktionen passgenau zu einer Lizenz konfiguriert.":["The energy monitoring system is assembled from suitable measuring devices and accessories and comes as a unit with an edge PC, energy management software and all necessary components. For the Emalytics building management system, controllers, supervisor, data points and functions are configured precisely into a license.","El sistema de monitorización energética se compone de los equipos de medición y accesorios adecuados y se entrega como una unidad con Edge PC, software de gestión energética y todos los componentes necesarios. Para el sistema de gestión de edificios Emalytics, los controladores, el supervisor, los puntos de datos y las funciones se configuran a medida en una licencia.","Le système de surveillance énergétique est composé d'appareils de mesure et d'accessoires adaptés et est livré comme un ensemble avec un PC Edge, un logiciel de gestion de l'énergie et tous les composants nécessaires. Pour le système de gestion technique du bâtiment Emalytics, contrôleurs, superviseur, points de données et fonctions sont configurés sur mesure en une licence.","能源监测系统由合适的测量设备和附件组成，作为一个整体交付，包含边缘PC、能源管理软件以及所有必要组件。对于楼宇管理系统Emalytics，控制器、Supervisor、数据点和功能将精确配置为一个许可证。"],"Dieses Seminar vermittelt die Grundlagen des CRA, zeigt praxisnahe Umsetzungsstrategien und stellt die Verbindung zu etablierten Sicherheitsstandards wie IEC 62443 her. Ziel ist es, Führungskräfte und Fachkräfte auf die kommenden Anforderungen vorzubereiten und Orientierung für die Umsetzung im Unternehmen zu geben.":["This seminar teaches the fundamentals of the CRA, shows practical implementation strategies and establishes the link to established security standards such as IEC 62443. The aim is to prepare managers and specialists for the upcoming requirements and provide guidance for implementation in the company.","Este seminario transmite los fundamentos del CRA, muestra estrategias de implementación prácticas y establece la conexión con estándares de seguridad consolidados como IEC 62443. El objetivo es preparar a directivos y especialistas para los próximos requisitos y orientar la implementación en la empresa.","Ce séminaire présente les bases du CRA, montre des stratégies de mise en œuvre pratiques et établit le lien avec des normes de sécurité reconnues comme l'IEC 62443. L'objectif est de préparer cadres et spécialistes aux exigences à venir et de les orienter pour la mise en œuvre dans l'entreprise.","本研讨会讲解CRA的基础知识，介绍贴近实践的实施策略，并将其与IEC 62443等成熟安全标准相关联。目的是帮助管理人员和专业人员为即将到来的要求做好准备，并为企业内部实施提供指导。"],"In diesem Praxisseminar werden unterschiedliche Messmethoden zu Ermittlung des Erderwiderstands vorgestellt und anschließend in einem Mess-Praktikum auf der Versuchsanlage durchgeführt. Dabei steht das Kennenlernen der Stärken und Schwächen der unterschiedlichen Messmethoden im Vordergrund.":["In this practical seminar, different measurement methods for determining earth resistance are presented and then carried out in a practical measurement session on the test facility. The focus is on getting to know the strengths and weaknesses of the different measurement methods.","En este seminario práctico se presentan diferentes métodos de medición para determinar la resistencia de tierra y, a continuación, se aplican en prácticas de medición en la instalación de ensayo. El objetivo principal es conocer los puntos fuertes y débiles de los distintos métodos de medición.","Dans ce séminaire pratique, différentes méthodes de mesure de la résistance de terre sont présentées puis mises en œuvre lors de travaux pratiques sur l'installation d'essai. L'accent est mis sur les forces et faiblesses des différentes méthodes de mesure.","在本实践研讨会中，将介绍测定接地电阻的不同测量方法，随后在试验设施上进行实际测量练习。重点在于了解各种测量方法的优缺点。"],"Registrierte Nutzende starten eine Angebotsanfrage direkt aus dem Warenkorb oder über eine Produktdetailseite. Sie erhalten schnell ein offizielles Angebotsdokument für die ausgewählten Produkte in der gewünschten Menge. Anfragen lassen sich auf der Plattform übersichtlich verwalten.":["Registered users can start a quotation request directly from the cart or from a product detail page. They quickly receive an official quotation document for the selected products in the desired quantity. Requests can be clearly managed on the platform.","Los usuarios registrados inician una solicitud de oferta directamente desde el carrito o desde una página de detalle de producto. Reciben rápidamente un documento de oferta oficial para los productos seleccionados en la cantidad deseada. Las solicitudes pueden gestionarse de forma clara en la plataforma.","Les utilisateurs inscrits lancent une demande de devis directement depuis le panier ou une page de détail produit. Ils reçoivent rapidement un devis officiel pour les produits sélectionnés dans la quantité souhaitée. Les demandes peuvent être gérées clairement sur la plateforme.","注册用户可直接从购物车或产品详情页发起报价申请，并快速获得所选产品按所需数量的正式报价文件。询价可在平台上清晰管理。"],"Nach Eingabe der technischen Daten schlagen die Konfiguratoren automatisch den passenden Überspannungsschutz vor. Abgedeckt sind Stromversorgungssysteme, MSR-Technik (Auswahl in zwei Schritten), Datennetzwerke der Informationstechnik sowie Sende- und Empfangsanlagen.":["After entering the technical data, the configurators automatically suggest suitable surge protection. Covered are power supply systems, MCR technology (selection in two steps), IT data networks, and transmitting and receiving systems.","Tras introducir los datos técnicos, los configuradores proponen automáticamente la protección contra sobretensiones adecuada. Abarcan sistemas de alimentación, técnica MCR (selección en dos pasos), redes de datos de tecnología de la información e instalaciones de emisión y recepción.","Après saisie des données techniques, les configurateurs proposent automatiquement la protection contre les surtensions adaptée. Sont couverts les systèmes d'alimentation, la technique MCR (sélection en deux étapes), les réseaux de données informatiques ainsi que les installations d'émission et de réception.","输入技术数据后，配置器会自动推荐合适的浪涌保护方案。涵盖供电系统、MCR技术（分两步选择）、信息技术数据网络以及发射和接收设备。"],"Veranstaltungen finden in Präsenz, online oder hybrid statt und sind nach Wissensstand von Basiswissen bis Expertenwissen eingeordnet. Auf Wunsch gibt es maßgeschneiderte Seminare, auch inhouse beim Kunden. Webinar-Aufzeichnungen stehen zusätzlich zur Verfügung.":["Events take place in person, online or hybrid and are classified by level of knowledge from basic to expert. Tailored seminars are available on request, including in-house at the customer's site. Webinar recordings are also available.","Los eventos se realizan de forma presencial, online o híbrida y se clasifican por nivel de conocimientos, de básico a experto. Bajo petición hay seminarios a medida, también in company en las instalaciones del cliente. Además, hay grabaciones de webinars disponibles.","Les sessions ont lieu en présentiel, en ligne ou en format hybride et sont classées par niveau, des connaissances de base au niveau expert. Des séminaires sur mesure sont possibles sur demande, y compris en intra chez le client. Des enregistrements de webinaires sont également disponibles.","活动以线下、在线或混合形式举办，并按知识水平从基础到专家进行分级。可应要求提供定制研讨会，也可在客户现场进行内训。此外还提供网络研讨会录像。"],"Auf Basis der Fragestellungen des Kunden oder der Ergebnisse einer Inspektion entwickelt Phoenix Contact passende, praxisnahe Sicherheitskonzepte. Diese entsprechen dem Stand der Technik und sind auf das jeweilige Unternehmen zugeschnitten.":["Based on the customer's questions or the results of an inspection, Phoenix Contact develops suitable, practical safety concepts. These reflect the state of the art and are tailored to the respective company.","A partir de las preguntas del cliente o de los resultados de una inspección, Phoenix Contact desarrolla conceptos de seguridad adecuados y prácticos. Estos corresponden al estado de la técnica y están adaptados a cada empresa.","Sur la base des questions du client ou des résultats d'une inspection, Phoenix Contact élabore des concepts de sécurité adaptés et pragmatiques. Ceux-ci sont conformes à l'état de l'art et taillés sur mesure pour chaque entreprise.","Phoenix Contact根据客户的问题或检查结果，制定合适且贴近实践的安全方案。这些方案符合最新技术水平，并针对各企业量身定制。"],"Das Webinar ermöglicht Ihnen den einfachen Einstieg in das Thema Fernwartung über das Internet. In unserem 2-stündigen Webinar vermitteln wir Ihnen Grundlagen zur industriellen Kommunikation via Internet, sowie IP- und VPN-Grundlagen.":["The webinar offers you an easy introduction to remote maintenance via the internet. In our 2-hour webinar, we teach you the fundamentals of industrial communication via the internet as well as IP and VPN basics.","El webinar le permite iniciarse fácilmente en el mantenimiento remoto a través de Internet. En nuestro webinar de 2 horas le transmitimos los fundamentos de la comunicación industrial vía Internet, así como conceptos básicos de IP y VPN.","Le webinaire vous offre une introduction simple à la télémaintenance via Internet. Dans notre webinaire de 2 heures, nous vous transmettons les bases de la communication industrielle via Internet ainsi que les notions de base IP et VPN.","本网络研讨会帮助您轻松入门基于互联网的远程维护。在2小时的研讨会中，我们将向您讲解通过互联网进行工业通信的基础知识以及IP和VPN基础。"],"Mit den Online-Konfiguratoren stellen Sie Produkte selbst zusammen. Sie sind in die Gruppen Verbinden; Versorgen, Laden und Schützen; Markieren, Montieren und Installieren sowie Schalten, Messen und Überwachen gegliedert.":["With the online configurators, you put products together yourself. They are divided into the groups Connecting; Supplying, Charging and Protecting; Marking, Mounting and Installing; and Switching, Measuring and Monitoring.","Con los configuradores online, usted mismo compone los productos. Se dividen en los grupos Conectar; Alimentar, Cargar y Proteger; Marcar, Montar e Instalar; y Conmutar, Medir y Supervisar.","Avec les configurateurs en ligne, vous composez vous-même vos produits. Ils sont répartis dans les groupes Connecter ; Alimenter, Charger et Protéger ; Marquer, Monter et Installer ; ainsi que Commuter, Mesurer et Surveiller.","借助在线配置器，您可以自行组合产品。配置器分为以下几组：连接；供电、充电与保护；标记、安装与布设；以及开关、测量与监控。"],"Beliebteste Einzelpakete im Maschinenbau: Spezifikation/Verifikation von Hardware mit SISTEMA, Erstellung und Prüfung von Betriebsanleitungen, Beurteilung von Gesamtheiten und wesentlichen Veränderungen.":["Most popular individual packages in mechanical engineering: specification/verification of hardware with SISTEMA, creation and review of operating instructions, assessment of assemblies of machinery and substantial modifications.","Paquetes individuales más solicitados en la construcción de maquinaria: especificación/verificación de hardware con SISTEMA, elaboración y revisión de manuales de instrucciones, evaluación de conjuntos de máquinas y modificaciones sustanciales.","Packs individuels les plus demandés en construction de machines : spécification/vérification du matériel avec SISTEMA, rédaction et contrôle de notices d'instructions, évaluation d'ensembles de machines et de modifications substantielles.","机械制造领域最受欢迎的单项服务包：使用SISTEMA进行硬件规格定义/验证、编制和审核操作说明书、评估机器组合及重大改装。"],"Engineering-Software für den Schaltschrankbau zur Planung und Bestellung von Klemmenleisten, bestückten Montageplatten und Klemmenkästen mit nahtloser Fertigungsdatenübertragung.":["Engineering software for control cabinet building for planning and ordering terminal strips, assembled mount
