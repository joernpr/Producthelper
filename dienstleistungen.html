ice-und-support"]]},{"id":"ce","kick":"Beratung & Sicherheit","title":"CE-Kennzeichnung für Maschinen und Schaltschränke","html":[["p","Eine unzureichende Richtlinienkonformität kann Abnahmeprobleme beim Endkunden, Rechtsansprüche Geschädigter, Rückrufaktionen oder Betriebsverbote durch die Marktaufsicht, Regressansprüche und Geldbußen nach sich ziehen."],["p","Das CE-Team von Phoenix Contact begleitet produktunabhängig auf dem ganzen Weg zur CE-Kennzeichnung, umfassend oder nur in einzelnen Schritten: von der Beratung über die Konzepterstellung bis zur normgerechten Nachweisdokumentation inklusive Betriebsanleitung."],["ul",["Wissen: Leitfaden zur CE-Kennzeichnung als Video oder PDF","Seminare, z. B. zur Maschinenrichtlinie 2006/42/EG, Risikobeurteilung nach EN ISO 12100 und Functional Safety nach EN ISO 13849-1","Dienstleistungen und Normen-Services, vom STARTER-Tag bis zum Komplettpaket"]],["links",["leitfaden-ce","starter-tag-ce","risikobeurteilung","ce-komplettpaket","normen-news-service","sprechstunde-maschinenverordnung"]],["src","https://www.phoenixcontact.com/de-de/service-und-support/industrial-services-security-safety-ce/ce-kennzeichnung-fuer-maschinen-und-schaltschraenke"]]},{"id":"security","kick":"Beratung & Sicherheit","title":"360° Industrial Security und IEC 62443","html":[["p","Der 360°-Industrial-Security-Ansatz betrachtet die drei Aspekte Menschen, Prozesse und Technologie. Ziel ist eine Anlage, die ganzheitlich gegen Cyberangriffe gesichert ist; Grundlage ist der Security-Standard IEC 62443."],["p","Neben der IT muss auch der OT-Bereich geschützt werden. Phoenix Contact bietet dafür Wissen (Leitfaden „Neun Schritte zur sicheren Anlage gemäß IEC 62443“, Kompaktseminar), einen Starter-Tag sowie Pakete von der Basisabsicherung bis zur maximalen Security."],["links",["starter-tag-security","basisabsicherung","maximale-security","sichere-fernwartung","kompaktseminar-360-security"]],["src","https://www.phoenixcontact.com/de-de/service-und-support/industrial-services-security-safety-ce/cyber-security-in-der-industrie"]]},{"id":"daten","kick":"Digitale Services & Daten","title":"Data Provisioning: BMEcat, EDI, Punchout und APIs","html":[["ul",["BMEcat: statische Kataloge mit vollständigen technischen und kaufmännischen Produktdaten sowie eCl@ss- und ETIM-Klassifizierung.","EDI: Bestellungen vollständig automatisiert direkt in das System von Phoenix Contact übertragen.","Punchout: Anbindung an das eigene Einkaufssystem per OCI oder cXML.","APIs: technische und kaufmännische Produktdaten in Echtzeit, dieselben Daten wie auf den Produktdetailseiten."]],["p","Mit einem Konto bei „Mein Phoenix Contact“ lassen sich Bestellungen verwalten, Lieferstatus prüfen, Angebote anfordern, eigene Preislisten oder BMEcat-Dateien erstellen und Favoriten speichern."],["links",["bmecat","edi","punchout","phoenix-contact-apis","mein-phoenix-contact","preislisten"]],["src","https://www.phoenixcontact.com/de-de/service-und-support/data-provisioning"]]},{"id":"kunden","kick":"Kundenspezifische Lösungen","title":"Kundenspezifisch fertigen oder selbst konfigurieren","html":[["p","Phoenix Contact fertigt auf Wunsch montierte Klemmenleisten, bestückte Gehäuse, individuelle Sets und vorgefertigte Tragschienen und entwickelt neue Produkte nach Kundenanforderung."],["p","Mit den Online-Konfiguratoren stellen Sie Produkte selbst zusammen. Sie sind in die Gruppen Verbinden; Versorgen, Laden und Schützen; Markieren, Montieren und Installieren sowie Schalten, Messen und Überwachen gegliedert."],["links",["klemmenleistenservice","bestueckte-gehaeuse","set-loesungen","vorgefertigte-tragschienen","individuelle-neuentwicklungen","kfg-kabel","kfg-klemmen-verteiler"]],["src","https://www.phoenixcontact.com/de-de/produkte/kundenspezifische-loesungen"]]},{"id":"retoure","kick":"Logistik & Support","title":"Reparatur, Rücksendung und Reklamation","html":[["p","Für Reparaturen, Rücksendungen, Reklamationen und die Rücknahme von Altgeräten gibt es eigene Anfra tion","beanstandung","gutschrift","zuruecksenden","zurueckschicken","zurueckgeben","altgeraet","ruecknahme","garantie"]},{"k":"thema","v":"Markierung","w":["markierung","beschriftung","drucker","thermotransfer","markieren","bluemark","thermomark","mietgeraet","mieten","miete"]},{"k":"thema","v":"Produktlebenszyklus","w":["abkuendigung","abgekuendigt","produktaenderung","pcn","nachfolger","lebenszyklus","psirt","schwachstelle","advisory"]},{"k":"thema","v":"Schulung","w":["schulung","seminar","training","webinar","weiterbildung","zertifikat","kurs","lehrgang","workshop","mitarbeiter schulen","inhouse"]},{"k":"b","v":"K","w":["konfigurator","konfigurieren","zusammenstellen"]},{"k":"b","v":"P","w":["fachplaner","planungsbuero","ausschreibung","grosshandel","grosshaendler","geraetehersteller","oem"]},{"k":"form","v":"vor Ort","w":["vor ort","bei uns","in unserem werk","inhouse"]},{"k":"form","v":"online","w":["online","remote","digital","webinar"]}],"tsEx":[["Maschinenbauer","Wir bauen eine neue Verpackungsmaschine und brauchen Unterstützung bei der CE-Kennzeichnung und der Risikobeurteilung.\nAußerdem soll die Fernwartung der Anlage nach IEC 62443 abgesichert werden.\n3 Mitarbeiter sollen eine Schulung zu Funktionaler Sicherheit besuchen."],["Einkauf","Wir möchten Bestellungen per EDI automatisieren und Produktdaten als BMEcat mit ETIM-Klassifizierung erhalten.\nBitte kostenlose Muster von zwei Klemmen schicken."],["Schaltschrankbau","Wir suchen vormontierte Klemmenleisten auf Tragschiene und konfektionierte Kabel.\nEPLAN-Daten für die Planung werden benötigt."],["Service","Ein Gerät ist defekt und muss repariert werden.\nZusätzlich wollen wir falsch bestellte Ware zurücksenden.\nWir brauchen einen Thermotransferdrucker zur Miete."]],"acc":{},"i18n":{"ID":["ID","ID","ID","ID"],"Name":["Name","Nombre","Nom","名称"],"Kurzbeschreibung":["Short description","Descripción breve","Description courte","简介"],"Normen / Regelwerke":["Standards / regulations","Normas / reglamentos","Normes / réglementations","标准 / 法规"],"Dauer":["Duration","Duración","Durée","时长"],"Seite":["Page","Página","Page","页面"],"Anfrage":["Request","Solicitud","Demande","询问"],"Derzeit sind keine Termine veröffentlicht.":["No dates are currently published.","Actualmente no hay fechas publicadas.","Aucune date n’est publiée actuellement.","目前没有公布日期。"],"Aktuelle Termine auf phoenixcontact.com":["Current dates on phoenixcontact.com","Fechas actuales en phoenixcontact.com","Dates actuelles sur phoenixcontact.com","phoenixcontact.com 上的最新日期"],"Rücksendungen gegen Gutschrift sind möglich, wenn das Auslieferungsdatum höchstens sechs Monate zurückliegt, die Ware dem aktuellen Fertigungsstand entspricht, das Verpackungssiegel unbeschädigt ist und pro Position mindestens 300 Euro Warennettowert erreicht werden; Made-to-Order-Produkte sind ausgeschlossen. Beanstandungen (z. B. falsches Produkt, Über-/Unterlieferung, Transportschaden, fehlerhaftes Produkt) werden ebenfalls online gestartet. Der Prozess läuft in sechs Schritten von der Anfrage über Bestätigung mit RMA-Nummer bis zur Eingangsbestätigung; Rücksendungen ohne Voranmeldung werden nicht bearbeitet. In der Online-Plattform kann der Einstieg über eigene Bestellungen oder manuelle Produktnummern erfolgen.":["Returns for credit are possible if the delivery date was no more than six months ago, the goods correspond to the current production status, the packaging seal is undamaged and a net goods value of at least 300 euros per item is reached; made-to-order products are excluded. Complaints (e.g. wrong product, over-/under-delivery, transport damage, defective product) are also started online. The process runs in six steps, from the request and confirmation with an RMA number to the receipt confirmation; returns without prior notification will not be processed. In the online platform, you can start from your own orders or enter product numbers manually.","Las devoluciones con abono son posibles si la fecha de entrega no supera los seis meses, la mercancía corresponde al estado de fabricación actual, el precinto del embalaje está intacto y se alcanza un valor neto mínimo de 300 euros por posición; se excluyen los productos fabricados por encargo. Las reclamaciones (p. ej., producto incorrecto, entrega en exceso o defecto, daños de transporte, producto defectuoso) también se inician online. El proceso consta de seis pasos, desde la solicitud y la confirmación con número RMA hasta la confirmación de recepción; las devoluciones sin aviso previo no se tramitan. En la plataforma online se puede empezar desde los propios pedidos o introduciendo manualmente los números de producto.","Les retours avec avoir sont possibles si la date de livraison remonte à six mois maximum, si la marchandise correspond à l'état de fabrication actuel, si le scellé de l'emballage est intact et si une valeur nette d'au moins 300 euros par position est atteinte ; les produits fabriqués sur commande sont exclus. Les réclamations (p. ex. mauvais produit, livraison excédentaire ou insuffisante, dommage de transport, produit défectueux) sont également lancées en ligne. Le processus se déroule en six étapes, de la demande à l'accusé de réception, en passant par la confirmation avec numéro RMA ; les retours sans notification préalable ne sont pas traités. Sur la plateforme en ligne, il est possible de démarrer à partir de ses propres commandes ou en saisissant manuellement les références.","如果交货日期不超过六个月、货物符合当前生产状态、包装封条完好且每个订单项的商品净值至少达到 300 欧元，即可退货并获得贷记；按订单定制的产品除外。投诉（例如产品错误、多发/少发、运输损坏、产品缺陷）同样可在线发起。流程分为六个步骤，从申请、带 RMA 编号的确认直至收货确认；未经事先通知的退货将不予处理。在线平台中可从自己的订单入手，或手动输入产品编号。"],"Im ersten Teil lernen die Teilnehmenden die Grundlagen und den Aufbau des Industrial-Security-Standards IEC 62443 für die Praxis. Im zweiten Teil analysiert das Experten-Team gemeinsam mit dem Kunden den Status quo der Anlagensicherheit: Schutzbedarf, Bedrohungen, Auswirkungen und vorhandene Sicherheitsstrukturen. Auf Basis der Ergebnisse erhält der Kunde unverbindliche Lösungsvorschläge zum weiteren Vorgehen. Zielgruppen sind u. a. Administratoren, CISO, Systemintegratoren, Hersteller sowie Betreiber von Steuerungs- und Leittechnik.":["In the first part, participants learn the fundamentals and structure of the industrial security standard IEC 62443 for practical use. In the second part, the expert team analyzes the status quo of plant security together with the customer: protection requirements, threats, impacts and existing security structures. Based on the results, the customer receives non-binding solution proposals for the next steps. Target groups include administrators, CISOs, system integrators, manufacturers and operators of control and automation systems.","En la primera parte, los participantes aprenden los fundamentos y la estructura de la norma de seguridad industrial IEC 62443 para la práctica. En la segunda parte, el equipo de expertos analiza junto con el cliente el estado actual de la seguridad de la instalación: necesidades de protección, amenazas, impactos y estructuras de seguridad existentes. A partir de los resultados, el cliente recibe propuestas de solución sin compromiso para los siguientes pasos. Los grupos destinatarios incluyen administradores, CISO, integradores de sistemas, fabricantes y operadores de sistemas de control.","Dans la première partie, les participants apprennent les bases et la structure de la norme de sécurité industrielle IEC 62443 pour la pratique. Dans la deuxième partie, l'équipe d'experts analyse avec le client l'état actuel de la sécurité de l'installation : besoins de protection, menaces, impacts et structures de sécurité existantes. Sur la base des résultats, le client reçoit des propositions de solutions sans engagement pour la suite. Les groupes cibles comprennent notamment les administrateurs, RSSI, intégrateurs système, fabricants et exploitants de systèmes de contrôle-commande.","第一部分中，学员将学习工业安全标准 IEC 62443 的基础知识和结构，并应用于实践。第二部分中，专家团队与客户共同分析设施安全现状：防护需求、威胁、影响以及现有安全架构。根据分析结果，客户将获得关于后续步骤的非约束性解决方案建议。目标群体包括管理员、CISO、系统集成商、制造商以及控制和自动化系统的运营方。"],"BMEcat ist das etablierte XML-Standardformat für den elektronischen Austausch von Produktkatalogen. Ein Phoenix Contact-Katalog enthält Artikelnummern, Beschreibungen und technische Daten, Preise, Rabatte und Verfügbarkeiten, ECLASS- und ETIM-Klassifikationen, Medienlinks sowie Lieferanten- und Herstellerinformationen. ERP-, PIM-, Shop- und Procurement-Systeme können die Dateien direkt einlesen. Über „Mein Phoenix Contact“ wählen Kunden Artikel und Format selbst aus und laden ihre individuelle BMEcat-Datei herunter.":["BMEcat is the established standard XML format for the electronic exchange of product catalogs. A Phoenix Contact catalog contains item numbers, descriptions and technical data, prices, discounts and availability, ECLASS and ETIM classifications, media links as well as supplier and manufacturer information. ERP, PIM, shop and procurement systems can import the files directly. Via “Mein Phoenix Contact”, customers select items and format themselves and download their individual BMEcat file.","BMEcat es el formato XML estándar consolidado para el intercambio electrónico de catálogos de productos. Un catálogo de Phoenix Contact contiene números de artículo, descripciones y datos técnicos, precios, descuentos y disponibilidad, clasificaciones ECLASS y ETIM, enlaces a medios e información de proveedores y fabricantes. Los sistemas ERP, PIM, tiendas online y de compras pueden importar los archivos directamente. A través de «Mein Phoenix Contact», los clientes eligen los artículos y el formato y descargan su archivo BMEcat individual.","BMEcat est le format XML standard établi pour l'échange électronique de catalogues produits. Un catalogue Phoenix Contact contient les références, descriptions et caractéristiques techniques, prix, remises et disponibilités, classifications ECLASS et ETIM, liens vers les médias ainsi que les informations fournisseur et fabricant. Les systèmes ERP, PIM, boutiques en ligne et achats peuvent importer directement les fichiers. Via « Mein Phoenix Contact », les clients sélectionnent eux-mêmes les articles et le format et téléchargent leur fichier BMEcat personnalisé.","BMEcat 是用于电子交换产品目录的成熟 XML 标准格式。Phoenix Contact 目录包含物料编号、描述和技术数据、价格、折扣和供货情况、ECLASS 和 ETIM 分类、媒体链接以及供应商和制造商信息。ERP、PIM、网店和采购系统可直接导入这些文件。客户可通过“Mein Phoenix Contact”自行选择物料和格式，并下载个性化的 BMEcat 文件。"],"Individuelle Produkte durchlaufen einen bewährten Entwicklungsprozess: Vorklärung mit Entwicklungsingenieuren, Technologie-Workshops, technischem Entwurf und unverbindlichem Preisangebot; Konzeption mit Pflichtenheft, Prüfplan inkl. Laborprüfungen und Zulassungen; Produktisierung; Produktion und Logistik von der Handmontage bis zur Großserie; Begleitung über den Produktlebenszyklus bis zur Abkündigung. Ergänzend bietet die Tochter Pulsotronic individuelle Sensorlösungen und Verbindungstechnik.":["Custom products go through a proven development process: preliminary clarification with development engineers, technology workshops, technical design and a non-binding price quotation; conception with specification, test plan incl. laboratory tests and approvals; productization; production and logistics from manual assembly to large-scale series; support throughout the product life cycle until discontinuation. In addition, the subsidiary Pulsotronic offers custom sensor solutions and connection technology.","Los productos personalizados siguen un proceso de desarrollo probado: aclaración previa con ingenieros de desarrollo, talleres tecnológicos, diseño técnico y oferta de precio sin compromiso; concepción con pliego de especificaciones, plan de pruebas incl. ensayos de laboratorio y homologaciones; industrialización; producción y logística desde el montaje manual hasta la gran serie; acompañamiento durante el ciclo de vida del producto hasta su descatalogación. Además, la filial Pulsotronic ofrece soluciones de sensores personalizadas y tecnología de conexión.","Les produits personnalisés suivent un processus de développement éprouvé : clarification préalable avec des ingénieurs de développement, ateliers technologiques, conception technique et offre de prix sans engagement ; conception avec cahier des charges, plan d'essais incl. essais en laboratoire et homologations ; industrialisation ; production et logistique, du montage manuel à la grande série ; accompagnement tout au long du cycle de vie du produit jusqu'à son arrêt. En complément, la filiale Pulsotronic propose des solutions de capteurs et une connectique sur mesure.","定制产品遵循成熟的开发流程：与开发工程师进行前期澄清、技术研讨会、技术设计和非约束性报价；方案设计，包括规格书、测试计划（含实验室测试和认证）；产品化；从手工装配到大批量生产的生产和物流；在整个产品生命周期内提供支持，直至停产。此外，子公司 Pulsotronic 还提供定制传感器解决方案和连接技术。"],"Für Tragschienengehäuse (ICS, BC, ME-IO, ME MAX, ME, ME-PLC, EH, UM-PRO, UM-BASIC) und Feldgehäuse (UCS, MCS, ECS, OCS) sowie das Pico-Off-Grid-System gibt es eigene Konfiguratoren. Gewählt werden Serie, Unterteil und abgestimmte Komponenten wie Anschlusstechnik, Displays, Keypads, Kühlkörper oder Busverbinder. Für ICS und UCS steht nach der Konfiguration eine Online-Thermosimulation zur Verfügung; individuelle ICS-Gehäusedeckel werden über PROTIQ konfiguriert.":["Dedicated configurators are available for DIN rail housings (ICS, BC, ME-IO, ME MAX, ME, ME-PLC, EH, UM-PRO, UM-BASIC), field housings (UCS, MCS, ECS, OCS) and the Pico off-grid system. You select the series, base element and matching components such as connection technology, displays, keypads, heat sinks or bus connectors. For ICS and UCS, an online thermal simulation is available after configuration; custom ICS housing covers are configured via PROTIQ.","Existen configuradores propios para carcasas para carril (ICS, BC, ME-IO, ME MAX, ME, ME-PLC, EH, UM-PRO, UM-BASIC), carcasas de campo (UCS, MCS, ECS, OCS) y el sistema Pico Off-Grid. Se eligen la serie, la parte inferior y los componentes compatibles, como tecnología de conexión, pantallas, teclados, disipadores o conectores de bus. Para ICS y UCS hay disponible una simulación térmica online tras la configuración; las tapas de carcasa ICS personalizadas se configuran a través de PROTIQ.","Des configurateurs dédiés existent pour les boîtiers pour profilé (ICS, BC, ME-IO, ME MAX, ME, ME-PLC, EH, UM-PRO, UM-BASIC), les boîtiers de terrain (UCS, MCS, ECS, OCS) et le système Pico Off-Grid. On choisit la série, l'embase et les composants adaptés tels que connectique, écrans, claviers, dissipateurs ou connecteurs de bus. Pour ICS et UCS, une simulation thermique en ligne est disponible après la configuration ; les couvercles de boîtier ICS personnalisés sont configurés via PROTIQ.","导轨式外壳（ICS、BC、ME-IO、ME MAX、ME、ME-PLC、EH、UM-PRO、UM-BASIC）、现场外壳（UCS、MCS、ECS、OCS）以及 Pico 离网系统均配有专用配置器。可选择系列、底座以及匹配的组件，如连接技术、显示屏、键盘、散热器或总线连接器。ICS 和 UCS 配置完成后可进行在线热仿真；定制 ICS 外壳盖板通过 PROTIQ 配置。"],"Die CE-Experten begleiten Maschinen- und Schaltschrankhersteller in allen Phasen der CE-Kennzeichnung, vom Starter-Workshop zur Ist-Erfassung bis zur Kennzeichnung des Produktes. Der Kunde entscheidet selbst, wie umfassend die Begleitung ist; die Leistungen werden an Bedarf und Situation angepasst. Enthalten sind auch Beratung und Coaching von Mitarbeitenden aller Kompetenzlevel. Ziel ist eine sichere und zugleich pragmatische CE-Kennzeichnung.":["The CE experts support machine and control cabinet manufacturers in all phases of CE marking, from the starter workshop for the as-is assessment to the marking of the product. The customer decides how extensive the support is; the services are adapted to needs and situation. Consulting and coaching for employees of all competence levels are also included. The goal is CE marking that is both reliable and pragmatic.","Los expertos en CE acompañan a fabricantes de máquinas y armarios de control en todas las fases del marcado CE, desde el taller inicial para el análisis de la situación actual hasta el marcado del producto. El cliente decide el alcance del acompañamiento; los servicios se adaptan a sus necesidades y situación. También se incluyen asesoramiento y coaching para empleados de todos los niveles de competencia. El objetivo es un marcado CE seguro y a la vez pragmático.","Les experts CE accompagnent les fabricants de machines et d'armoires électriques dans toutes les phases du marquage CE, de l'atelier de démarrage pour l'état des lieux jusqu'au marquage du produit. Le client décide lui-même de l'étendue de l'accompagnement ; les prestations sont adaptées aux besoins et à la situation. Le conseil et le coaching des collaborateurs de tous niveaux de compétence sont également inclus. L'objectif est un marquage CE à la fois sûr et pragmatique.","CE 专家在 CE 标志的各个阶段为机器和控制柜制造商提供支持，从用于现状评估的入门研讨会到产品标志。客户可自行决定支持的范围；服务将根据需求和实际情况量身定制。同时还为各能力水平的员工提供咨询和辅导。目标是实现安全且务实的 CE 标志。"],"Das Kompaktseminar fasst zentrales Wissen zur umfassenden Absicherung von Anlagen zusammen: aktuelle Security-Risiken und Bedrohungen, den 360°-Industrial-Security-Ansatz, die IEC 62443, neun zentrale Schritte zur sicheren Anlage und das IT-Sicherheitsgesetz 2.0. Die Aufzeichnung steht nach Registrierung sofort zur Verfügung. Ergänzend gibt es einen kostenlosen Leitfaden „Industrial Security richtig umsetzen“ als PDF und A3-Poster.":["The compact seminar summarizes key knowledge on comprehensive plant protection: current security risks and threats, the 360° industrial security approach, IEC 62443, nine key steps to a secure plant and the German IT Security Act 2.0. The recording is available immediately after registration. In addition, there is a free guide “Implementing industrial security correctly” as a PDF and A3 poster.","El seminario compacto resume los conocimientos clave para la protección integral de instalaciones: riesgos y amenazas de seguridad actuales, el enfoque de seguridad industrial 360°, la IEC 62443, nueve pasos clave hacia una instalación segura y la Ley alemana de seguridad informática 2.0. La grabación está disponible inmediatamente tras el registro. Además, hay una guía gratuita «Implementar correctamente la seguridad industrial» en PDF y póster A3.","Le séminaire compact résume les connaissances essentielles pour une protection complète des installations : risques et menaces de sécurité actuels, approche de sécurité industrielle à 360°, IEC 62443, neuf étapes clés vers une installation sécurisée et la loi allemande sur la sécurité informatique 2.0. L'enregistrement est disponible immédiatement après inscription. En complément, un guide gratuit « Bien mettre en œuvre la sécurité industrielle » est proposé en PDF et en poster A3.","该精简研讨会汇总了全面保护设施的核心知识：当前的安全风险与威胁、360° 工业安全方法、IEC 62443、实现安全设施的九个关键步骤以及德国《IT 安全法 2.0》。注册后即可观看录像。此外，还提供免费的《正确实施工业安全》指南（PDF 和 A3 海报）。"],"QUINT POWER-Stromversorgungen lassen sich mit frei wählbaren Meldeschwellen, Kennlinien und Ausgangsspannungen anpassen und ab einem Stück bestellen. Für CAPAROC erhalten Kunden ab Stückzahl 1 alle Planungsunterlagen inkl. 2D-/3D-Modellen, Systemdatenblatt und individueller Artikelnummer. Der Konfigurator für steckbare Geräteschutzschalter ermittelt den passenden Schutzschalter inklusive Mindestquerschnitt und Leitungslänge.":["QUINT POWER power supplies can be customized with freely selectable signal thresholds, characteristic curves and output voltages and ordered from a quantity of one. For CAPAROC, customers receive all planning documents from quantity 1, incl. 2D/3D models, system data sheet and an individual item number. The configurator for pluggable device circuit breakers determines the right circuit breaker, including minimum cross-section and cable length.","Las fuentes de alimentación QUINT POWER se pueden adaptar con umbrales de señalización, curvas características y tensiones de salida de libre elección y pedir a partir de una unidad. Para CAPAROC, los clientes reciben desde 1 unidad toda la documentación de planificación, incl. modelos 2D/3D, hoja de datos del sistema y número de artículo individual. El configurador de interruptores de protección de equipos enchufables determina el interruptor adecuado, incluida la sección mínima y la longitud del cable.","Les alimentations QUINT POWER peuvent être adaptées avec des seuils de signalisation, des courbes caractéristiques et des tensions de sortie librement sélectionnables, et commandées dès une pièce. Pour CAPAROC, les clients reçoivent dès 1 pièce tous les documents de planification, y compris modèles 2D/3D, fiche technique système et référence individuelle. Le configurateur de disjoncteurs de protection d'appareils enfichables détermine le disjoncteur adapté, y compris la section minimale et la longueur de câble.","QUINT POWER 电源可通过自由选择的报警阈值、特性曲线和输出电压进行定制，并可一件起订。对于 CAPAROC，客户从 1 件起即可获得全部规划资料，包括 2D/3D 模型、系统数据表和独立物料编号。插拔式设备断路器配置器可确定合适的断路器，包括最小导线截面和电缆长度。"],"Neben Komplettpaket und Risikobeurteilung bietet Phoenix Contact für den Maschinenbau gezielte Einzelpakete an. Dazu zählen die Spezifikation oder Verifikation sicherheitsbezogener Hardware mit SISTEMA, die Erstellung und Prüfung von Betriebsanleitungen sowie die Beurteilung der Gesamtheit und wesentlichen Veränderung von Maschinen. Die Pakete werden über ein Erstgespräch angefragt und auf den Bedarf zugeschnitten.":["In addition to the complete package and risk assessment, Phoenix Contact offers targeted individual packages for mechanical engineering. These include the specification or verification of safety-related hardware with SISTEMA, the creation and review of operating instructions, and the assessment of assemblies of machinery and substantial modifications of machines. The packages are requested via an initial consultation and tailored to requirements.","Además del paquete completo y la evaluación de riesgos, Phoenix Contact ofrece paquetes individuales específicos para la construcción de maquinaria. Entre ellos se encuentran la especificación o verificación de hardware relacionado con la seguridad con SISTEMA, la elaboración y revisión de manuales de instrucciones y la evaluación de conjuntos de máquinas y modificaciones sustanciales de máquinas. Los paquetes se solicitan mediante una primera consulta y se adaptan a las necesidades.","Outre le pack complet et l'appréciation des risques, Phoenix Contact propose des packs individuels ciblés pour la construction de machines. Ils comprennent la spécification ou la vérification de matériel lié à la sécurité avec SISTEMA, la rédaction et le contrôle de notices d'utilisation ainsi que l'évaluation d'ensembles de machines et de modifications substantielles de machines. Les packs sont demandés via un premier entretien et adaptés aux besoins.","除完整套餐和风险评估外，Phoenix Contact 还为机械制造提供有针对性的单项套餐。其中包括使用 SISTEMA 对安全相关硬件进行规范或验证、编制和审核操作说明书，以及评估机器组合和机器的重大改动。可通过初次咨询申请这些套餐，并根据需求量身定制。"],"Mit einem Anomalieerkennungssystem werden die im Produktionsnetz auftretenden Datenströme überwacht. So lassen sich Angriffe frühzeitig erkennen und Unternehmensschäden wie Produktionsausfälle abwenden. Phoenix Contact implementiert hierfür IRMA® OT-EVAL; der Einstieg erfolgt über ein kostenloses Erstgespräch. Anomalieerkennung ist auch Bestandteil der Partnerschaft für Cybersicherheit in erneuerbaren Energien.":["An anomaly detection system monitors the data streams occurring in the production network. This allows attacks to be detected early and business damage such as production downtime to be averted. Phoenix Contact implements IRMA® OT-EVAL for this purpose; the starting point is a free initial consultation. Anomaly detection is also part of the partnership for cybersecurity in renewable energies.","Un sistema de detección de anomalías supervisa los flujos de datos que se producen en la red de producción. Así se pueden detectar ataques de forma temprana y evitar daños empresariales como paradas de producción. Phoenix Contact implementa para ello IRMA® OT-EVAL; el punto de partida es una primera consulta gratuita. La detección de anomalías también forma parte de la colaboración para la ciberseguridad en energías renovables.","Un système de détection d'anomalies surveille les flux de données circulant dans le réseau de production. Les attaques peuvent ainsi être détectées tôt et les dommages pour l'entreprise, comme les arrêts de production, évités. Phoenix Contact met en œuvre IRMA® OT-EVAL à cet effet ; le point de départ est un premier entretien gratuit. La détection d'anomalies fait également partie du partenariat pour la cybersécurité dans les énergies renouvelables.","异常检测系统可监控生产网络中出现的数据流，从而及早发现攻击，避免停产等企业损失。Phoenix Contact 为此部署 IRMA® OT-EVAL；可从免费的初次咨询开始。异常检测也是可再生能源网络安全合作的组成部分。"],"Preislisten stehen nach Login in gängigen Formaten zum Download bereit. Zusätzlich können Nutzende unter „Mein Phoenix Contact“ eine eigene Preisliste gestalten: Artikel auswählen, Format festlegen und die fertige Liste direkt herunterladen. Der Service ist ideal für Einkauf, Vertrieb und technische Beratung; auch der Elektrofachgroßhandel bezieht hierüber Artikelstammdaten und Preislisten.":["After login, price lists are available for download in common formats. In addition, users can design their own price list under “Mein Phoenix Contact”: select items, define the format and download the finished list directly. The service is ideal for purchasing, sales and technical consulting; electrical wholesalers also obtain item master data and price lists this way.","Tras iniciar sesión, las listas de precios están disponibles para descargar en formatos habituales. Además, en «Mein Phoenix Contact» los usuarios pueden crear su propia lista de precios: seleccionar artículos, definir el formato y descargar directamente la lista terminada. El servicio es ideal para compras, ventas y asesoramiento técnico; los mayoristas de material eléctrico también obtienen por esta vía datos maestros de artículos y listas de precios.","Après connexion, les listes de prix sont disponibles au téléchargement dans les formats courants. Les utilisateurs peuvent en outre créer leur propre liste de prix dans « Mein Phoenix Contact » : sélectionner les articles, définir le format et télécharger directement la liste finalisée. Ce service est idéal pour les achats, la vente et le conseil technique ; les grossistes en matériel électrique y obtiennent également les données de base des articles et les listes de prix.","登录后可下载常见格式的价格表。此外，用户还可以在“Mein Phoenix Contact”中创建自己的价格表：选择物料、确定格式并直接下载完成的列表。该服务非常适合采购、销售和技术咨询；电气批发商也通过此途径获取物料主数据和价格表。"],"Benötigt ein Kunde vorübergehend zusätzliche Beschriftungskapazität, hat projektspezifische Markierungsanforderungen oder ist sein Markierungssystem in Reparatur, stellt Phoenix Contact Mietgeräte bereit. Nach Abstimmung wird das Gerät zugesandt, auf Wunsch gemeinsam installiert und der Kunde in der sicheren Bedienung geschult. Die Anfrage erfolgt über ein Mietgeräteformular.":["If a customer temporarily needs additional marking capacity, has project-specific marking requirements or their marking system is under repair, Phoenix Contact provides rental devices. After coordination, the device is shipped, installed together on request, and the customer is trained in its safe operation. Requests are made via a rental device form.","Si un cliente necesita temporalmente capacidad de rotulación adicional, tiene requisitos de marcado específicos de un proyecto o su sistema de marcado está en reparación, Phoenix Contact pone a su disposición equipos de alquiler. Tras la coordinación, se envía el equipo, se instala conjuntamente si se desea y se forma al cliente en su manejo seguro. La solicitud se realiza mediante un formulario de equipos de alquiler.","Si un client a temporairement besoin d'une capacité de marquage supplémentaire, a des exigences de marquage spécifiques à un projet ou si son système de marquage est en réparation, Phoenix Contact met à disposition des appareils en location. Après concertation, l'appareil est expédié, installé ensemble sur demande, et le client est formé à son utilisation en toute sécurité. La demande s'effectue via un formulaire de location.","如果客户临时需要额外的标记能力、有项目特定的标记要求或其标记系统正在维修，Phoenix Contact 可提供租赁设备。协调后寄送设备，可应要求共同安装，并对客户进行安全操作培训。可通过租赁设备表单提出申请。"],"Phoenix Contact erstellt für und mit dem Kunden Gefährdungsbeurteilungen nach der Betriebssicherheitsverordnung und den Technischen Regeln für Betriebssicherheit. Ziel ist es, Gefährdungen für Mitarbeitende bei der Verwendung von Arbeitsmitteln zu bewerten, Schutzmaßnahmen festzulegen und deren Wirksamkeit zu prüfen. Das Team unterstützt auch bei der Umsetzung der Maßnahmen.":["Phoenix Contact prepares risk assessments for and with the customer in accordance with the German Industrial Safety Regulation (BetrSichV) and the Technical Rules for Operational Safety (TRBS). The aim is to assess hazards to employees when using work equipment, define protective measures and check their effectiveness. The team also supports the implementation of the measures.","Phoenix Contact elabora para y con el cliente evaluaciones de riesgos laborales conforme a la normativa alemana de seguridad operativa (BetrSichV) y las Reglas Técnicas de Seguridad Operativa (TRBS). El objetivo es evaluar los peligros para los empleados al utilizar equipos de trabajo, definir medidas de protección y comprobar su eficacia. El equipo también ayuda a implementar las medidas.","Phoenix Contact réalise pour et avec le client des évaluations des risques professionnels conformément à l'ordonnance allemande sur la sécurité industrielle (BetrSichV) et aux règles techniques de sécurité d'exploitation (TRBS). L'objectif est d'évaluer les dangers pour les collaborateurs lors de l'utilisation d'équipements de travail, de définir des mesures de protection et de vérifier leur efficacité. L'équipe accompagne également la mise en œuvre des mesures.","Phoenix Contact 根据德国《工业安全条例》（BetrSichV）和《运行安全技术规则》（TRBS）为客户并与客户共同编制危害评估。目标是评估员工使用工作设备时面临的危险、确定防护措施并检查其有效性。团队还协助实施这些措施。"],"Mit dem HEAVYCON-Konfigurator entstehen fehlerfreie schwere Steckverbinder über Filtermenüs sowie 2D- und 3D-Ansichten; Artikel können exportiert, versendet oder direkt bestellt werden. Der IPD-Konfigurator unterstützt die schnelle, flexible Energieverteilung mit Installationssteckverbindern und -verteilern inklusive 3D-Ansicht sowie Export- und Bestelloptionen.":["The HEAVYCON configurator lets you create error-free heavy-duty connectors via filter menus and 2D and 3D views; items can be exported, sent or ordered directly. The IPD configurator supports fast, flexible power distribution with installation connectors and distributors, including 3D view as well as export and ordering options.","Con el configurador HEAVYCON se crean conectores para cargas pesadas sin errores mediante menús de filtro y vistas 2D y 3D; los artículos se pueden exportar, enviar o pedir directamente. El configurador IPD facilita una distribución de energía rápida y flexible con conectores y distribuidores de instalación, incluida vista 3D y opciones de exportación y pedido.","Le configurateur HEAVYCON permet de créer des connecteurs industriels sans erreur grâce à des menus de filtres et des vues 2D et 3D ; les articles peuvent être exportés, envoyés ou commandés directement. Le configurateur IPD facilite une distribution d'énergie rapide et flexible avec des connecteurs et répartiteurs d'installation, y compris vue 3D et options d'export et de commande.","借助 HEAVYCON 配置器，可通过筛选菜单以及 2D 和 3D 视图无误地创建重载连接器；物料可导出、发送或直接订购。IPD 配置器支持使用安装连接器和分配器实现快速、灵活的配电，并提供 3D 视图以及导出和订购选项。"],"In der Sprechstunde beraten die Experten von Phoenix Contact dazu, welchen Einfluss die neue Maschinenverordnung auf die eigene Anwendung hat. Besprochen werden Neuerungen, Auswirkungen und notwendige Maßnahmen. Die Sprechstunde dient auch als kostenloses Erstgespräch für die Industrial Security & Safety Services und wird über ein Formular angefragt.":["In the consultation hour, Phoenix Contact experts advise on how the new Machinery Regulation affects your own application. New requirements, impacts and necessary measures are discussed. The consultation hour also serves as a free initial consultation for the Industrial Security & Safety Services and is requested via a form.","En la consulta, los expertos de Phoenix Contact asesoran sobre cómo afecta el nuevo Reglamento de Máquinas a la propia aplicación. Se tratan novedades, impactos y medidas necesarias. La consulta sirve también como primera consulta gratuita para los Industrial Security & Safety Services y se solicita mediante un formulario.","Lors de la permanence, les experts Phoenix Contact conseillent sur l'impact du nouveau règlement Machines sur votre propre application. Les nouveautés, les conséquences et les mesures nécessaires sont abordées. La permanence sert également de premier entretien gratuit pour les Industrial Security & Safety Services et se demande via un formulaire.","在咨询时段中，Phoenix Contact 专家将就新版《机械法规》对您自身应用的影响提供建议，讨论新要求、影响及必要措施。该咨询时段也可作为 Industrial Security & Safety Services 的免费初次咨询，可通过表单申请。"],"Treten unvorhergesehene Probleme an einem Produkt auf, steht ein kompetentes Serviceteam zur Seite. Die Reparatur wird über die Rücksendeanwendung auf der Webseite angefragt; nach Bestätigung erhält der Kunde eine RMA-Nummer und einen Rücklieferschein. Die Sendung wird mit RMA-Nummer gekennzeichnet und an die angegebene Adresse geschickt.":["If unforeseen problems occur with a product, a competent service team is on hand. The repair is requested via the returns application on the website; after confirmation, the customer receives an RMA number and a return delivery note. The shipment is labeled with the RMA number and sent to the specified address.","Si surgen problemas imprevistos con un producto, un equipo de servicio competente le ayuda. La reparación se solicita a través de la aplicación de devoluciones del sitio web; tras la confirmación, el cliente recibe un número RMA y un albarán de devolución. El envío se marca con el número RMA y se remite a la dirección indicada.","En cas de problème imprévu sur un produit, une équipe de service compétente est à vos côtés. La réparation se demande via l'application de retour sur le site web ; après confirmation, le client reçoit un numéro RMA et un bon de retour. L'envoi est marqué avec le numéro RMA et expédié à l'adresse indiquée.","如产品出现意外问题，专业服务团队将随时提供支持。可通过网站上的退货应用申请维修；确认后，客户将收到 RMA 编号和退货单。货件须标注 RMA 编号并寄往指定地址。"],"Die Seminare vermitteln praxisnahes Wissen zu aktuellen Herausforderungen der Maschinensicherheit und der Betriebssicherheitsverordnung bis hin zum Umbauen und Instandhalten von Maschinen und Anlagen. Alle Seminare sind auch als Inhouse-Veranstaltung möglich; ergänzend gibt es themenspezifische Consulting-Leistungen.":["The seminars provide practical knowledge on current challenges in machine safety and the German Industrial Safety Regulation, through to the modification and maintenance of machines and plants. All seminars are also available as in-house events; topic-specific consulting services are offered in addition.","Los seminarios transmiten conocimientos prácticos sobre los retos actuales de la seguridad de máquinas y la normativa alemana de seguridad operativa, hasta la transformación y el mantenimiento de máquinas e instalaciones. Todos los seminarios también se pueden realizar in situ en la empresa; además, se ofrecen servicios de consultoría específicos.","Les séminaires transmettent des connaissances pratiques sur les défis actuels de la sécurité des machines et de l'ordonnance allemande sur la sécurité industrielle, jusqu'à la transformation et la maintenance des machines et installations. Tous les séminaires sont également proposés en intra-entreprise ; des prestations de conseil thématiques sont proposées en complément.","研讨会传授有关机器安全和德国《工业安全条例》当前挑战的实用知识，直至机器和设备的改造与维护。所有研讨会均可作为企业内训举办；另提供专题咨询服务。"],"Servicetechniker richten das Markierungssystem direkt beim Kunden ein, inklusive vorinstallierter Software und notwendiger Treiber. Anschließend werden die Anwender intensiv in Gerät und Software geschult; gemeinsam werden Druckaufträge bearbeitet. Das Dienstleistungsportfolio unterliegt regionalen Anpassungen.":["Service technicians set up the marking system directly at the customer's site, including preinstalled software and necessary drivers. Users are then trained intensively on the device and software; print jobs are processed together. The service portfolio is subject to regional adjustments.","Los técnicos de servicio instalan el sistema de marcado directamente en las instalaciones del cliente, incluido el software preinstalado y los controladores necesarios. A continuación, se forma intensivamente a los usuarios en el equipo y el software; los trabajos de impresión se procesan conjuntamente. La cartera de servicios está sujeta a adaptaciones regionales.","Des techniciens de service installent le système de marquage directement chez le client, y compris le logiciel préinstallé et les pilotes nécessaires. Les utilisateurs sont ensuite formés de manière approfondie à l'appareil et au logiciel ; les travaux d'impression sont traités ensemble. Le portefeuille de services est soumis à des adaptations régionales.","服务技术人员直接在客户现场安装标记系统，包括预装软件和必要的驱动程序。随后对用户进行设备和软件的深入培训，并共同处理打印任务。服务组合可能因地区而有所调整。"],"Die Industrial Security & Safety Services umfassen auch die Prozesssicherheit. Phoenix Contact begleitet Betreiber von Prozessanlagen auf dem gesamten Weg: Durchführung von HAZOP-Studien, Auslegung von Sicherheitsfunktionen und Prüfung ihrer Wirksamkeit. Der Einstieg erfolgt über ein Erstgespräch.":["The Industrial Security & Safety Services also cover process safety. Phoenix Contact supports operators of process plants all the way: conducting HAZOP studies, designing safety functions and verifying their effectiveness. The starting point is an initial consultation.","Los Industrial Security & Safety Services también abarcan la seguridad de procesos. Phoenix Contact acompaña a los operadores de plantas de proceso en todo el camino: realización de estudios HAZOP, diseño de funciones de seguridad y verificación de su eficacia. El punto de partida es una primera consulta.","Les Industrial Security & Safety Services couvrent également la sécurité des procédés. Phoenix Contact accompagne les exploitants d'installations de procédés tout au long du parcours : réalisation d'études HAZOP, conception de fonctions de sécurité et vérification de leur efficacité. Le point de départ est un premier entretien.","Industrial Security & Safety Services 还涵盖过程安全。Phoenix Contact 全程支持过程设施运营方：开展 HAZOP 研究、设计安全功能并验证其有效性。可从初次咨询开始。"],"Das Seminarangebot deckt die Vielfalt der Automatisierung ab – vom Programmierwerkzeug PLCnext Engineer über die Safety-Programmierung bis zur Zertifizierung als PROFINET Engineer. Neu ist ein Seminar zu CE-konformer Software und funktionaler Sicherheit nach Stand der Technik.":["The seminar program covers the full range of automation – from the PLCnext Engineer programming tool and safety programming to certification as a PROFINET Engineer. New: a seminar on CE-compliant software and state-of-the-art functional safety.","La oferta de seminarios abarca toda la diversidad de la automatización: desde la herramienta de programación PLCnext Engineer y la programación de seguridad hasta la certificación como PROFINET Engineer. Novedad: un seminario sobre software conforme a CE y seguridad funcional según el estado de la técnica.","L'offre de séminaires couvre toute la diversité de l'automatisation – de l'outil de programmation PLCnext Engineer à la programmation de sécurité, jusqu'à la certification PROFINET Engineer. Nouveau : un séminaire sur les logiciels conformes CE et la sécurité fonctionnelle selon l'état de l'art.","研讨会涵盖自动化的各个领域——从编程工具 PLCnext Engineer、安全编程到 PROFINET Engineer 认证。新增：关于符合 CE 要求的软件和最先进功能安全的研讨会。"],"In die App-basierte Maschineninspektion fließen über 10 Jahre Praxiserfahrung und aktuelles Rechts- und Normenwissen ein. Die Experten bewerten den Sicherheitszustand von Maschinen, zeigen Mängel auf und machen Vorschläge zur Bewahrung und Wiederherstellung der Sicherheit.":["The app-based machine inspection draws on more than 10 years of practical experience and up-to-date legal and standards knowledge. The experts assess the safety status of machines, identify deficiencies and make proposals for maintaining and restoring safety.","La inspección de máquinas basada en app aúna más de 10 años de experiencia práctica y conocimientos actualizados de legislación y normativa. Los expertos evalúan el estado de seguridad de las máquinas, señalan deficiencias y proponen medidas para mantener y restablecer la seguridad.","L'inspection de machines via application s'appuie sur plus de 10 ans d'expérience pratique et des connaissances juridiques et normatives à jour. Les experts évaluent l'état de sécurité des machines, identifient les défauts et formulent des propositions pour maintenir et rétablir la sécurité.","基于应用程序的机器检查融合了 10 年以上的实践经验以及最新的法规和标准知识。专家评估机器的安全状态、指出缺陷，并就保持和恢复安全提出建议。"],"Bei Umbauten an Maschinen stellt sich die Frage einer wesentlichen Veränderung. Phoenix Contact vermittelt das nötige Wissen, berät und dokumentiert nachhaltig. Der Kunde entscheidet, ob das Team ihn unterstützt oder die Bewertung vollständig übernimmt.":["When machines are modified, the question of a substantial modification arises. Phoenix Contact provides the necessary knowledge, advises and documents sustainably. The customer decides whether the team supports them or takes over the assessment completely.","Cuando se modifican máquinas, surge la cuestión de si se trata de una modificación sustancial. Phoenix Contact transmite los conocimientos necesarios, asesora y documenta de forma sostenible. El cliente decide si el equipo le apoya o asume por completo la evaluación.","Lors de la transformation de machines se pose la question d'une modification substantielle. Phoenix Contact transmet les connaissances nécessaires, conseille et documente durablement. Le client décide si l'équipe l'assiste ou prend entièrement en charge l'évaluation.","改造机器时会涉及是否构成重大改动的问题。Phoenix Contact 传授必要知识、提供咨询并进行可持续的记录。客户可决定由团队提供支持，或由团队全面负责评估。"],"Die Seminare qualifizieren zum Experten für intelligente Gebäude mit dem Gebäudemanagementsystem Emalytics, das Management, Bedienung und Energiemanagement vereint. Zusätzlich wird ein zertifiziertes Niagara 4 TCP Training (Tridium Certified) angeboten.":["The seminars qualify you as an expert for intelligent buildings with the Emalytics building management system, which combines management, operation and energy management. A certified Niagara 4 TCP training (Tridium Certified) is also offered.","Los seminarios le cualifican como experto en edificios inteligentes con el sistema de gestión de edificios Emalytics, que combina gestión, manejo y gestión energética. Además, se ofrece una formación certificada Niagara 4 TCP (Tridium Certified).","Les séminaires vous qualifient comme expert des bâtiments intelligents avec le système de gestion technique du bâtiment Emalytics, qui réunit gestion, exploitation et gestion de l'énergie. Une formation certifiée Niagara 4 TCP (Tridium Certified) est également proposée.","这些研讨会可帮助您成为使用 Emalytics 楼宇管理系统的智能建筑专家，该系统集管理、操作和能源管理于一体。此外还提供经认证的 Niagara 4 TCP 培训（Tridium Certified）。"],"Der Cyber Resilience Act (CRA) schafft einen neuen Rechtsrahmen für die Cyber Security vernetzter Produkte und stellt Entwicklungs- und Projektteams vor neue technische, organisatorische und regulatorische Herausforderungen.":["The Cyber Resilience Act (CRA) creates a new legal framework for the cyber security of connected products and presents development and project teams with new technical, organizational and regulatory challenges.","La Cyber Resilience Act (CRA) crea un nuevo marco jurídico para la ciberseguridad de los productos conectados y plantea a los equipos de desarrollo y de proyecto nuevos retos técnicos, organizativos y normativos.","Le Cyber Resilience Act (CRA) crée un nouveau cadre juridique pour la cybersécurité des produits connectés et confronte les équipes de développement et de projet à de nouveaux défis techniques, organisationnels et réglementaires.","《网络弹性法案》（CRA）为联网产品的网络安全建立了新的法律框架，给开发和项目团队带来了新的技术、组织和监管挑战。"],"Sie brauchen Sicherheit im Umgang mit den von der PROFINET-Nutzerorganisation definierten Standards? Unsere Trainer zeigen Ihnen, was bei der Planung, Programmierung und Inbetriebnahme von PROFINET-Systemen zu beachten ist.":["Do you need confidence in handling the standards defined by the PROFINET user organization? Our trainers show you what to consider when planning, programming and commissioning PROFINET systems.","¿Necesita seguridad en el manejo de los estándares definidos por la organización de usuarios de PROFINET? Nuestros formadores le muestran qué tener en cuenta al planificar, programar y poner en marcha sistemas PROFINET.","Vous souhaitez maîtriser les standards définis par l'organisation des utilisateurs PROFINET ? Nos formateurs vous montrent ce qu'il faut prendre en compte lors de la planification, de la programmation et de la mise en service de systèmes PROFINET.","您需要熟练掌握 PROFINET 用户组织定义的标准吗？我们的培训师将向您展示在规划、编程和调试 PROFINET 系统时需要注意的事项。"],"Analyse, Dokumentation und Beratung, ob es sich bei einer Verkettung um eine Gesamtheit von Maschinen handelt – auf Wunsch mit Engineering und Übernahme der Verantwortung als Bevollmächtigter.":["Analysis, documentation and advice on whether a linked system constitutes an assembly of machinery – on request with engineering and assumption of responsibility as authorized representative.","Análisis, documentación y asesoramiento sobre si un encadenamiento constituye un conjunto de máquinas, con ingeniería y asunción de la responsabilidad como representante autorizado si se desea.","Analyse, documentation et conseil pour déterminer si un enchaînement constitue un ensemble de machines – sur demande avec ingénierie et prise de responsabilité en tant que mandataire.","分析、记录并咨询某一联动系统是否构成机器组合——可应要求提供工程服务，并作为授权代表承担责任。"],"Phoenix Contact fertigt auf Wunsch montierte Klemmenleisten, bestückte Gehäuse, individuelle Sets und vorgefertigte Tragschienen und entwickelt neue Produkte nach Kundenanforderung.":["On request, Phoenix Contact manufactures assembled terminal strips, equipped housings, custom sets and prefabricated DIN rails, and develops new products according to customer requirements.","Bajo pedido, Phoenix Contact fabrica regletas de bornes montadas, carcasas equipadas, sets personalizados y carriles premontados, y desarrolla nuevos productos según los requisitos del cliente.","Sur demande, Phoenix Contact fabrique des borniers assemblés, des boîtiers équipés, des kits personnalisés et des profilés préassemblés, et développe de nouveaux produits selon les exigences du client.","Phoenix Contact 可按需生产已组装端子排、已装配外壳、定制套件和预制导轨，并根据客户要求开发新产品。"],"Konfiguratoren für FIX-Verteilerblöcke, Messwandler-Trennklemmen, Prüfstecksysteme FAME, Rangierverteiler PTRV, Rangierwaben PTMC, VARIOFACE und Hochstrom-Durchführungsklemmen.":["Configurators for FIX distribution blocks, instrument transformer disconnect terminal blocks, FAME test plug systems, PTRV marshalling panels, PTMC marshalling modules, VARIOFACE and high-current feed-through terminal blocks.","Configuradores para bloques de distribución FIX, bornes seccionables para transformadores de medida, sistemas de clavijas de prueba FAME, distribuidores de cableado PTRV, módulos de cableado PTMC, VARIOFACE y bornes de paso para alta corriente.","Configurateurs pour blocs de distribution FIX, blocs de jonction sectionnables pour transformateurs de mesure, systèmes de fiches de test FAME, répartiteurs PTRV, modules de répartition PTMC, VARIOFACE et blocs de jonction de traversée fort courant.","适用于 FIX 分配块、互感器断开端子、FAME 测试插头系统、PTRV 编组分配器、PTMC 编组模块、VARIOFACE 和大电流穿墙端子的配置器。"],"Programmatischer Echtzeit-Zugriff auf technische und kaufmännische Produktdaten über Product Commercial API, Product Information API und Asset Administration Shell API.":["Programmatic real-time access to technical and commercial product data via Product Commercial API, Product Information API and Asset Administration Shell API.","Acceso programático en tiempo real a datos técnicos y comerciales de productos mediante Product Commercial API, Product Information API y Asset Administration Shell API.","Accès programmatique en temps réel aux données produits techniques et commerciales via Product Commercial API, Product Information API et Asset Administration Shell API.","通过 Product Commercial API、Product Information API 和 Asset Administration Shell API 以编程方式实时访问技术和商务产品数据。"],"Channel Partner Management mit Kundencenter, technischem Innendienst und regionalem Außendienst sowie Stammdaten, Preislisten und Services für den Großhandel.":["Channel partner management with customer center, technical inside sales and regional field sales, plus master data, price lists and services for wholesalers.","Gestión de socios de canal con centro de atención al cliente, servicio técnico interno y servicio externo regional, así como datos maestros, listas de precios y servicios para mayoristas.","Gestion des partenaires de distribution avec centre clients, service technique sédentaire et service commercial régional, ainsi que données de base, listes de prix et services pour les grossistes.","渠道合作伙伴管理，包括客户中心、技术内勤和区域外勤，以及面向批发商的主数据、价格表和服务。"],"Wirkungsvollste Absicherungsstrategie: Aufdeckung, Analyse und Beseitigung aller Gefährdungen im Unternehmen zum Schutz von Mitarbeitenden und Wertschöpfung.":["The most effective protection strategy: detecting, analyzing and eliminating all hazards in the company to protect employees and value creation.","La estrategia de protección más eficaz: detección, análisis y eliminación de todos los peligros en la empresa para proteger a los empleados y la creación de valor.","La stratégie de protection la plus efficace : détection, analyse et élimination de tous les dangers dans l'entreprise pour protéger les collaborateurs et la création de valeur.","最有效的防护策略：发现、分析并消除企业内的所有危险，保护员工和价值创造。"],"Neuerstellung, Prüfung/Bewertung, Überarbeitung und Be
