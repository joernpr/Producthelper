 ist PLCnext Technology: echtzeitfähige SPS-Applikationen in IEC 61131-3 oder C++, inklusive Datenbanken oder Cloud-Konnektoren auf der Steuerung. Der Umfang reicht von Entwicklungsunterstützung über einzelne Arbeitspakete bis zur vollständigen Umsetzung; regelmäßige Abstimmungen halten den Kunden auf dem aktuellen Stand.":["Phoenix Contact turns customer ideas into software solutions for its own products and compatible systems, also in-house at the customer's site on request. Alongside PLC programming according to IEC 61131-3, C/C++, C#, Java, Python, Go, HTML/JavaScript and web frameworks such as vue.js are used. The focus is on PLCnext Technology: real-time PLC applications in IEC 61131-3 or C++, including databases or cloud connectors on the controller. The scope ranges from development support and individual work packages to complete implementation; regular status meetings keep the customer up to date.","Phoenix Contact convierte las ideas de los clientes en soluciones de software para productos propios y sistemas compatibles, también in situ en las instalaciones del cliente si lo desea. Además de la programación de PLC según IEC 61131-3, se utilizan C/C++, C#, Java, Python, Go, HTML/JavaScript y frameworks web como vue.js. El foco está en PLCnext Technology: aplicaciones PLC en tiempo real en IEC 61131-3 o C++, incluidas bases de datos o conectores cloud en el controlador. El alcance va desde el apoyo al desarrollo y paquetes de trabajo individuales hasta la implementación completa; las reuniones periódicas mantienen al cliente informado.","Phoenix Contact transforme les idées des clients en solutions logicielles pour ses propres produits et des systèmes compatibles, également sur site chez le client si souhaité. Outre la programmation d'automates selon IEC 61131-3, les langages C/C++, C#, Java, Python, Go, HTML/JavaScript et des frameworks web comme vue.js sont utilisés. L'accent est mis sur PLCnext Technology : applications automates temps réel en IEC 61131-3 ou C++, y compris bases de données ou connecteurs cloud sur l'automate. Le périmètre va du soutien au développement et de lots de travaux individuels jusqu'à la réalisation complète ; des points réguliers tiennent le client informé.","Phoenix Contact 将客户的想法转化为适用于自有产品及兼容系统的软件解决方案，也可应要求在客户现场实施。除符合 IEC 61131-3 的 PLC 编程外，还使用 C/C++、C#、Java、Python、Go、HTML/JavaScript 以及 vue.js 等 Web 框架。重点是 PLCnext Technology：基于 IEC 61131-3 或 C++ 的实时 PLC 应用，包括控制器上的数据库或云连接器。服务范围从开发支持、单个工作包到完整实施；定期沟通确保客户随时了解最新进展。"],"Phoenix Contact erstellt rechtskonforme Produkt- und Nutzungsinformationen für Anlagen, Einzelprodukte oder Software – gemäß Maschinenrichtlinie, Niederspannungsrichtlinie, EMV und ATEX und u. a. nach DIN EN ISO 82079-1 und DIN EN ISO 20607. Bestehende Anleitungen werden anhand normbasierter Checklisten geprüft und bewertet, Optimierungspunkte dokumentiert und auf Wunsch umgesetzt, etwa bei Retrofits oder veralteter Anlagendokumentation. Ausgabe gedruckt, als PDF oder Online-Hilfe-System. Ergebnis sind eine optimierte Benutzerfreundlichkeit und Supportreduktion.":["Phoenix Contact creates legally compliant product and user information for systems, individual products or software – in accordance with the Machinery Directive, Low Voltage Directive, EMC and ATEX and, among others, DIN EN ISO 82079-1 and DIN EN ISO 20607. Existing manuals are checked and assessed using standards-based checklists, areas for improvement are documented and implemented on request, for example for retrofits or outdated system documentation. Output in print, as PDF or as an online help system. The result is improved usability and reduced support effort.","Phoenix Contact elabora información de producto y de uso conforme a la ley para instalaciones, productos individuales o software, según la Directiva de Máquinas, la Directiva de Baja Tensión, CEM y ATEX y, entre otras, DIN EN ISO 82079-1 y DIN EN ISO 20607. Los manuales existentes se revisan y evalúan con listas de verificación basadas en normas, se documentan los puntos de mejora y, si se desea, se implementan, por ejemplo en retrofits o documentación de instalaciones obsoleta. Entrega impresa, en PDF o como sistema de ayuda online. El resultado: mayor facilidad de uso y menos soporte.","Phoenix Contact rédige des informations produit et d'utilisation conformes à la législation pour des installations, des produits individuels ou des logiciels – selon la directive Machines, la directive Basse tension, CEM et ATEX et notamment DIN EN ISO 82079-1 et DIN EN ISO 20607. Les notices existantes sont contrôlées et évaluées à l'aide de check-lists basées sur les normes, les points d'amélioration sont documentés et mis en œuvre sur demande, par exemple lors de retrofits ou de documentation d'installation obsolète. Diffusion imprimée, en PDF ou sous forme d'aide en ligne. Résultat : une meilleure ergonomie et moins de support.","Phoenix Contact 为设备、单个产品或软件编制符合法规的产品和使用信息——符合机械指令、低电压指令、EMC 和 ATEX，并遵循 DIN EN ISO 82079-1 和 DIN EN ISO 20607 等标准。现有说明书将依据基于标准的检查清单进行审查和评估，记录优化点并可应要求实施，例如用于改造项目或过时的设备文档。可提供印刷版、PDF 或在线帮助系统。成果是更佳的易用性和更少的支持需求。"],"Das Product Security Incident Response Team reagiert auf potenzielle Sicherheitslücken in Produkten, Lösungen und Diensten von Phoenix Contact und seinen Tochterunternehmen. Es koordiniert Offenlegung und Untersuchung und veröffentlicht Sicherheitshinweise, auch gemeinsam mit anderen Unternehmen auf CERT@VDE. Jeder kann Schwachstellen per E-Mail (möglichst PGP-verschlüsselt) melden, ohne NDA; der Eingang wird innerhalb von zwei Geschäftstagen bestätigt. Ein englischsprachiger PSIRT-Newsletter informiert über neue Hinweise.":["The Product Security Incident Response Team responds to potential security vulnerabilities in products, solutions and services of Phoenix Contact and its subsidiaries. It coordinates disclosure and investigation and publishes security advisories, also jointly with other companies on CERT@VDE. Anyone can report vulnerabilities by e-mail (preferably PGP-encrypted), without an NDA; receipt is confirmed within two business days. An English-language PSIRT newsletter provides information on new advisories.","El Product Security Incident Response Team responde a posibles vulnerabilidades de seguridad en productos, soluciones y servicios de Phoenix Contact y sus filiales. Coordina la divulgación y la investigación y publica avisos de seguridad, también junto con otras empresas en CERT@VDE. Cualquier persona puede notificar vulnerabilidades por correo electrónico (preferiblemente cifrado con PGP), sin NDA; la recepción se confirma en un plazo de dos días hábiles. Un boletín PSIRT en inglés informa sobre nuevos avisos.","La Product Security Incident Response Team réagit aux failles de sécurité potentielles dans les produits, solutions et services de Phoenix Contact et de ses filiales. Elle coordonne la divulgation et l'analyse et publie des avis de sécurité, également conjointement avec d'autres entreprises sur CERT@VDE. Chacun peut signaler des vulnérabilités par e-mail (de préférence chiffré PGP), sans NDA ; la réception est confirmée sous deux jours ouvrés. Une newsletter PSIRT en anglais informe des nouveaux avis.","产品安全事件响应团队（PSIRT）负责处理 Phoenix Contact 及其子公司产品、解决方案和服务中的潜在安全漏洞。该团队协调漏洞披露和调查，并发布安全公告，也会与其他企业在 CERT@VDE 上联合发布。任何人均可通过电子邮件（最好使用 PGP 加密）报告漏洞，无需签署 NDA；将在两个工作日内确认收到。英文版 PSIRT 新闻通讯提供新公告信息。"],"Die Seite bündelt Informationen zu Leiterplattenklemmen, Leiterplatten- und Board-to-Board-Steckverbindern sowie Elektronikgehäusen inklusive Varianten und Neuentwicklung. Digitale Services umfassen Produktnavigator, Konfiguratoren, kostenlosen Musterservice, Distributorensuche und Produktetiketten mit Scan-Code für automatisierte Logistik. Hinzu kommen Technologieinformationen (z. B. Single Pair Ethernet, Anschlusstechnologien, LWL, biobasierte Produkte) sowie Whitepapers, Referenzen und Broschüren.":["The page brings together information on PCB terminal blocks, PCB and board-to-board connectors and electronics housings, including variants and new developments. Digital services include the product navigator, configurators, a free sample service, distributor search and product labels with scan code for automated logistics. In addition, there is technology information (e.g. Single Pair Ethernet, connection technologies, fiber optics, bio-based products) as well as white papers, references and brochures.","La página reúne información sobre bornes para placa de circuito impreso, conectores para placa y board-to-board, así como carcasas para electrónica, incluidas variantes y nuevos desarrollos. Los servicios digitales incluyen navegador de productos, configuradores, servicio gratuito de muestras, búsqueda de distribuidores y etiquetas de producto con código escaneable para logística automatizada. Además, información tecnológica (p. ej., Single Pair Ethernet, tecnologías de conexión, fibra óptica, productos de base biológica), así como whitepapers, referencias y folletos.","La page regroupe des informations sur les borniers pour circuits imprimés, les connecteurs pour circuits imprimés et board-to-board ainsi que les boîtiers électroniques, y compris variantes et nouveaux développements. Les services numériques comprennent le navigateur produits, des configurateurs, un service d'échantillons gratuit, la recherche de distributeurs et des étiquettes produit avec code scannable pour une logistique automatisée. S'y ajoutent des informations technologiques (p. ex. Single Pair Ethernet, technologies de raccordement, fibre optique, produits biosourcés) ainsi que des livres blancs, références et brochures.","该页面汇集了 PCB 接线端子、PCB 及板对板连接器以及电子外壳（包括变型和新开发）的相关信息。数字化服务包括产品导航、配置器、免费样品服务、分销商查询以及带扫描码的产品标签，用于自动化物流。此外还提供技术信息（如单对以太网、连接技术、光纤、生物基产品）以及白皮书、参考案例和宣传册。"],"Diese Konfiguratoren aus dem Bereich „Verbinden“ stellen Klemmen- und Verteilerlösungen individuell zusammen: Verteiler-, Funktions- und Geräteklemmenblöcke in verschiedenen Farben, Messwandlersätze inkl. Prüf- und Kurzschlusszubehör, FAME-Prüfstecksysteme für Strom- und Spannungswandler, Rangierverteiler und -waben sowie Plug-and-Play-Systemverkabelung für Steuerungen mit 3D-Modellen. Hochstrom-Durchführungsklemmen lassen sich mit Optionen für Aufbau, Montage und Beschriftung konfigurieren.":["These configurators from the “Connect” area put together terminal block and distribution solutions individually: distribution, function and device terminal blocks in various colors, instrument transformer sets incl. test and short-circuit accessories, FAME test plug systems for current and voltage transformers, marshalling distributors and marshalling panels, as well as plug-and-play system cabling for controllers with 3D models. High-current feed-through terminal blocks can be configured with options for design, mounting and marking.","Estos configuradores del área «Conectar» permiten componer soluciones de bornes y distribución a medida: bloques de bornes de distribución, de función y para aparatos en distintos colores, juegos para transformadores de medida con accesorios de prueba y cortocircuito, sistemas de clavijas de prueba FAME para transformadores de corriente y tensión, distribuidores y paneles de interconexión, así como cableado de sistema plug-and-play para controladores con modelos 3D. Los bornes de paso de alta corriente se configuran con opciones de estructura, montaje y rotulación.","Ces configurateurs du domaine « Connecter » composent individuellement des solutions de borniers et de répartition : blocs de jonction de répartition, de fonction et pour appareils de différentes couleurs, ensembles pour transformateurs de mesure avec accessoires de test et de court-circuit, systèmes de fiches de test FAME pour transformateurs de courant et de tension, répartiteurs et panneaux de brassage ainsi que câblage système plug-and-play pour automates avec modèles 3D. Les blocs de jonction de traversée haute intensité se configurent avec des options de structure, de montage et de repérage.","这些来自“连接”领域的配置器可单独组合接线端子和分配解决方案：多种颜色的分配、功能和设备端子块，含测试和短路附件的互感器套件，用于电流和电压互感器的 FAME 测试插头系统，跳线分配器和跳线面板，以及带 3D 模型的控制器即插即用系统布线。大电流穿墙端子可配置结构、安装和标记选项。"],"Die Seminare vermitteln praxisnahes Wissen zur neuen Maschinenverordnung, zum Schutz vor Korrumpierung (prEN 50742), zur Risikobeurteilung nach EN ISO 12100, zur Konformitätsbewertung sowie zu Normen wie EN ISO 13849, EN 60204 und EN 61439. Das Angebot reicht vom Entscheider-Einstieg über Basiswissen für Projektleiter und Konstrukteure bis zum FS Technician for Machinery mit TÜV-Rheinland-Zertifikat. Inhouse-Durchführung und Consulting sind möglich.":["The seminars provide practical knowledge on the new Machinery Regulation, protection against corruption (prEN 50742), risk assessment according to EN ISO 12100, conformity assessment and standards such as EN ISO 13849, EN 60204 and EN 61439. The offer ranges from an introduction for decision-makers and basic knowledge for project managers and designers to the FS Technician for Machinery with TÜV Rheinland certificate. In-house delivery and consulting are available.","Los seminarios transmiten conocimientos prácticos sobre el nuevo Reglamento de Máquinas, la protección contra la corrupción (prEN 50742), la evaluación de riesgos según EN ISO 12100, la evaluación de la conformidad y normas como EN ISO 13849, EN 60204 y EN 61439. La oferta va desde la introducción para responsables de decisiones y conocimientos básicos para jefes de proyecto y diseñadores hasta el FS Technician for Machinery con certificado de TÜV Rheinland. Es posible la impartición in situ y la consultoría.","Les séminaires transmettent des connaissances pratiques sur le nouveau règlement Machines, la protection contre la corruption (prEN 50742), l'appréciation des risques selon EN ISO 12100, l'évaluation de la conformité ainsi que des normes telles que EN ISO 13849, EN 60204 et EN 61439. L'offre va de l'introduction pour décideurs et des bases pour chefs de projet et concepteurs jusqu'au FS Technician for Machinery avec certificat TÜV Rheinland. Formation sur site et conseil possibles.","研讨会传授关于新机械法规、防篡改保护（prEN 50742）、依据 EN ISO 12100 的风险评估、合格评定以及 EN ISO 13849、EN 60204 和 EN 61439 等标准的实用知识。课程范围从面向决策者的入门、面向项目经理和设计人员的基础知识，到获得 TÜV Rheinland 证书的 FS Technician for Machinery。可提供企业内训和咨询服务。"],"Zur Reduzierung des Aufwands in Material- und Lagerwirtschaft können Kunden vorkommissionierte Material-Sets bestellen. Diese können Einzelprodukte aus dem Phoenix Contact-Portfolio sowie individuelle Klemmenleisten oder Tragschienen enthalten. Auf Basis von Excel/PDF, ECAD-Stückliste oder Zeichnung prüfen Experten die Zusammenstellung und fassen sie unter einer Artikelnummer zusammen; die Umverpackung wird auf den Prozess abgestimmt.":["To reduce effort in materials management and warehousing, customers can order pre-picked material sets. These can contain individual products from the Phoenix Contact portfolio as well as custom terminal strips or DIN rails. Based on Excel/PDF, an ECAD bill of materials or a drawing, experts check the configuration and combine it under one item number; the outer packaging is adapted to the process.","Para reducir el esfuerzo en la gestión de materiales y almacén, los clientes pueden pedir kits de material preparados. Estos pueden contener productos individuales del portfolio de Phoenix Contact, así como regletas de bornes o carriles personalizados. A partir de Excel/PDF, una lista de materiales ECAD o un plano, los expertos revisan la composición y la agrupan bajo un único número de artículo; el embalaje exterior se adapta al proceso.","Pour réduire la charge de gestion des matériaux et des stocks, les clients peuvent commander des kits de matériel pré-préparés. Ceux-ci peuvent contenir des produits individuels du portefeuille Phoenix Contact ainsi que des borniers ou profilés personnalisés. Sur la base d'un fichier Excel/PDF, d'une nomenclature ECAD ou d'un plan, des experts vérifient la composition et la regroupent sous une seule référence ; le suremballage est adapté au processus.","为减少物料和仓储管理工作量，客户可订购预拣配的物料套件。套件可包含 Phoenix Contact 产品组合中的单个产品以及定制端子排或 DIN 导轨。专家根据 Excel/PDF、ECAD 物料清单或图纸检查组合，并将其归入同一个订货号；外包装根据流程进行调整。"],"Als Einzelpaket erstellen bzw. prüfen die CE-Experten die Risikobeurteilung nach einem etablierten Vorgehen mit erprobter Dokumentenvorlage. Betrachtet werden die Grenzen des Produkts, Gefährdungen, Risikoeinschätzung und -bewertung bis zur Ableitung von Maßnahmen zur Risikominderung. Ziel sind ein sicheres Produkt und eine richtlinienkonforme Dokumentation. Passend dazu wird das Seminar „Risikobeurteilung EN ISO 12100“ empfohlen.":["As a standalone package, the CE experts prepare or review the risk assessment using an established procedure with a proven document template. They consider the limits of the product, hazards, risk estimation and evaluation through to deriving risk reduction measures. The goal is a safe product and directive-compliant documentation. The seminar “Risk assessment EN ISO 12100” is recommended as a complement.","Como paquete individual, los expertos en CE elaboran o revisan la evaluación de riesgos según un procedimiento establecido con una plantilla de documentos probada. Se consideran los límites del producto, los peligros, la estimación y valoración de riesgos hasta la definición de medidas de reducción de riesgos. El objetivo es un producto seguro y una documentación conforme a las directivas. Como complemento se recomienda el seminario «Evaluación de riesgos EN ISO 12100».","En tant que prestation individuelle, les experts CE réalisent ou vérifient l'appréciation des risques selon une démarche éprouvée avec un modèle de document validé. Sont examinés les limites du produit, les phénomènes dangereux, l'estimation et l'évaluation des risques jusqu'à la définition de mesures de réduction des risques. L'objectif : un produit sûr et une documentation conforme aux directives. Le séminaire « Appréciation des risques EN ISO 12100 » est recommandé en complément.","作为单项服务包，CE 专家采用成熟流程和经过验证的文档模板编制或审查风险评估。内容涵盖产品界限、危险、风险估计和评价，直至制定风险降低措施。目标是实现安全的产品和符合指令的文档。建议配套参加“风险评估 EN ISO 12100”研讨会。"],"Die Partnerschaft von pure ISM GmbH und PHOENIX CONTACT Deutschland GmbH richtet sich an Unternehmen der erneuerbaren Energien, z. B. Windparkbetreiber. Pure ISM bringt Branchen-Know-how in Cyber- und Informationssicherheit ein, Phoenix Contact Automatisierungslösungen und sichere, vernetzte Technologien. Themen sind Security in IT und OT, Beratung und Anomalieerkennung vor dem Hintergrund verschärfter EU-Gesetzgebung.":["The partnership between pure ISM GmbH and PHOENIX CONTACT Deutschland GmbH is aimed at renewable energy companies, e.g. wind farm operators. Pure ISM contributes industry know-how in cyber and information security, Phoenix Contact automation solutions and secure, networked technologies. Topics include security in IT and OT, consulting and anomaly detection against the backdrop of stricter EU legislation.","La colaboración entre pure ISM GmbH y PHOENIX CONTACT Deutschland GmbH está dirigida a empresas de energías renovables, p. ej., operadores de parques eólicos. Pure ISM aporta conocimiento sectorial en ciberseguridad y seguridad de la información; Phoenix Contact, soluciones de automatización y tecnologías seguras y conectadas. Los temas son seguridad en IT y OT, consultoría y detección de anomalías ante una legislación de la UE más estricta.","Le partenariat entre pure ISM GmbH et PHOENIX CONTACT Deutschland GmbH s'adresse aux entreprises des énergies renouvelables, p. ex. les exploitants de parcs éoliens. Pure ISM apporte son savoir-faire sectoriel en cybersécurité et sécurité de l'information, Phoenix Contact des solutions d'automatisation et des technologies sécurisées et connectées. Thèmes : sécurité IT et OT, conseil et détection d'anomalies dans le contexte d'une législation européenne renforcée.","pure ISM GmbH 与 PHOENIX CONTACT Deutschland GmbH 的合作面向可再生能源企业，例如风电场运营商。Pure ISM 提供网络与信息安全领域的行业专业知识，Phoenix Contact 提供自动化解决方案以及安全的网络化技术。主题包括 IT 和 OT 安全、咨询以及在欧盟立法日趋严格背景下的异常检测。"],"Über OCI oder cXML greifen Kunden aus ihrem ERP- bzw. Einkaufssystem in Echtzeit auf den Online-Katalog zu. Der Warenkorb wird mit Artikelnummer, Bezeichnung, Menge, Artikel-, Gesamt- und Listenpreis an das eigene System übertragen, sodass interne Genehmigungsprozesse erhalten bleiben. Mit „Punchout und Checkout“ kann die Bestellung zusätzlich direkt im E-Shop ausgelöst werden. Kontakt: ebusiness@phoenixcontact.de.":["Via OCI or cXML, customers access the online catalog in real time from their ERP or procurement system. The shopping cart is transferred to their own system with item number, description, quantity, item, total and list price, so that internal approval processes are retained. With “Punchout and Checkout”, the order can also be placed directly in the e-shop. Contact: ebusiness@phoenixcontact.de.","Mediante OCI o cXML, los clientes acceden en tiempo real al catálogo online desde su sistema ERP o de compras. La cesta se transfiere a su propio sistema con número de artículo, denominación, cantidad, precio del artículo, total y de lista, de modo que se mantienen los procesos internos de aprobación. Con «Punchout y Checkout», el pedido también puede realizarse directamente en la tienda online. Contacto: ebusiness@phoenixcontact.de.","Via OCI ou cXML, les clients accèdent en temps réel au catalogue en ligne depuis leur système ERP ou d'achat. Le panier est transféré dans leur propre système avec référence, désignation, quantité, prix unitaire, total et prix catalogue, ce qui préserve les processus internes d'approbation. Avec « Punchout et Checkout », la commande peut aussi être passée directement dans l'e-shop. Contact : ebusiness@phoenixcontact.de.","客户可通过 OCI 或 cXML 从其 ERP 或采购系统实时访问在线目录。购物车连同订货号、名称、数量、单价、总价和目录价格传输至客户自有系统，从而保留内部审批流程。借助“Punchout 和 Checkout”，还可直接在网店中下单。联系方式：ebusiness@phoenixcontact.de。"],"In diesem Webinar vermitteln wir Ihnen die Grundlagen von Industrial Ethernet. Sie erfahren, wie Managed Switches optimal in Automatisierungsanwendungen eingesetzt werden und wie Sie Netzwerke hinsichtlich Performance und Verfügbarkeit verbessern. Darüber hinaus erhalten Sie wertvolle Tipps zur Auswahl der passenden Netzwerkinfrastruktur für PROFINET, EtherNet/IP und weitere Ethernet-basierte Anwendungen.":["In this webinar, we teach you the fundamentals of Industrial Ethernet. You will learn how to use managed switches optimally in automation applications and how to improve networks in terms of performance and availability. You will also receive valuable tips on selecting the right network infrastructure for PROFINET, EtherNet/IP and other Ethernet-based applications.","En este webinar le transmitimos los fundamentos de Industrial Ethernet. Aprenderá a utilizar de forma óptima los switches gestionados en aplicaciones de automatización y a mejorar las redes en cuanto a rendimiento y disponibilidad. Además, recibirá valiosos consejos para elegir la infraestructura de red adecuada para PROFINET, EtherNet/IP y otras aplicaciones basadas en Ethernet.","Dans ce webinaire, nous vous présentons les bases d'Industrial Ethernet. Vous apprendrez à utiliser de manière optimale les switchs managés dans les applications d'automatisation et à améliorer les réseaux en termes de performance et de disponibilité. Vous recevrez en outre de précieux conseils pour choisir l'infrastructure réseau adaptée à PROFINET, EtherNet/IP et d'autres applications basées sur Ethernet.","在本次网络研讨会中，我们将向您介绍工业以太网的基础知识。您将了解如何在自动化应用中优化使用网管型交换机，以及如何提升网络的性能和可用性。此外，您还将获得为 PROFINET、EtherNet/IP 及其他基于以太网的应用选择合适网络基础设施的宝贵建议。"],"Phoenix Contact informiert über geplante Produktänderungen und -abkündigungen in der Regel mindestens sechs Monate vor Umsetzung und Auslieferung. Die PCN wird nach dem Industriestandard VDMA 24903 / smartPCN digital bereitgestellt. Die Benachrichtigung wird nach persönlichem Interessenprofil konfiguriert und enthält ausschließlich technische Informationen ohne werblichen Charakter.":["Phoenix Contact generally provides information on planned product changes and discontinuations at least six months before implementation and delivery. The PCN is provided digitally according to the industry standard VDMA 24903 / smartPCN. The notification is configured according to a personal interest profile and contains exclusively technical information without advertising content.","Phoenix Contact informa sobre los cambios y discontinuaciones de productos previstos, por regla general, al menos seis meses antes de su implementación y entrega. La PCN se proporciona digitalmente según el estándar industrial VDMA 24903 / smartPCN. La notificación se configura según un perfil de intereses personal y contiene exclusivamente información técnica sin carácter publicitario.","Phoenix Contact informe des modifications et arrêts de produits prévus en règle générale au moins six mois avant leur mise en œuvre et leur livraison. La PCN est fournie sous forme numérique selon le standard industriel VDMA 24903 / smartPCN. La notification est configurée selon un profil d'intérêts personnel et contient exclusivement des informations techniques sans caractère publicitaire.","Phoenix Contact 通常至少在实施和交付前六个月通知计划中的产品变更和停产。PCN 按照行业标准 VDMA 24903 / smartPCN 以数字方式提供。通知根据个人兴趣配置，仅包含技术信息，不含广告内容。"],"Die Seminare vermitteln Wissen zur CE-Kennzeichnung, zur normgerechten Auslegung elektrischer Ausrüstungen und Schaltgerätekombinationen sowie zu Anforderungen für den nordamerikanischen Markt (UL 508A, NFPA 79). Ergänzend gibt es Schulungen zu clipx ENGINEER, ein Webinar zur MARKING system Software und eine Expertenausbildung zu Lean Production und Digitalisierung.":["The seminars cover CE marking, standards-compliant design of electrical equipment and switchgear assemblies, and requirements for the North American market (UL 508A, NFPA 79). In addition, there are training courses on clipx ENGINEER, a webinar on the MARKING system software and expert training on lean production and digitalization.","Los seminarios transmiten conocimientos sobre el marcado CE, el diseño conforme a normas de equipos eléctricos y conjuntos de aparamenta, así como los requisitos para el mercado norteamericano (UL 508A, NFPA 79). Además, hay formaciones sobre clipx ENGINEER, un webinar sobre el software MARKING system y una formación de expertos en Lean Production y digitalización.","Les séminaires abordent le marquage CE, la conception conforme aux normes des équipements électriques et des ensembles d'appareillage ainsi que les exigences du marché nord-américain (UL 508A, NFPA 79). S'y ajoutent des formations sur clipx ENGINEER, un webinaire sur le logiciel MARKING system et une formation d'expert en Lean Production et digitalisation.","研讨会讲授 CE 标志、电气设备和开关设备组合的合规设计，以及北美市场要求（UL 508A、NFPA 79）。此外还提供 clipx ENGINEER 培训、MARKING system 软件网络研讨会以及精益生产与数字化专家培训。"],"Der MARKING Configurator ermöglicht die einfache Erstellung individuell beschrifteter Kennzeichnungslösungen aus dem MARKING system-Portfolio. Kunden wählen aus über 2.000 Materialien die passende Lösung für Klemmen, Leiter und Kabel sowie Geräte und Anlagen. Die beschrifteten Materialien werden bereits ab Stückzahl eins bestellt und von Phoenix Contact gefertigt.":["The MARKING Configurator makes it easy to create individually printed marking solutions from the MARKING system portfolio. Customers choose the right solution for terminal blocks, conductors and cables as well as devices and systems from over 2,000 materials. The printed materials can be ordered from a quantity of one and are manufactured by Phoenix Contact.","El MARKING Configurator permite crear fácilmente soluciones de identificación rotuladas a medida del portfolio MARKING system. Los clientes eligen entre más de 2.000 materiales la solución adecuada para bornes, conductores y cables, así como aparatos e instalaciones. Los materiales rotulados se pueden pedir desde una unidad y los fabrica Phoenix Contact.","Le MARKING Configurator permet de créer facilement des solutions de repérage imprimées individuellement à partir du portefeuille MARKING system. Les clients choisissent parmi plus de 2 000 matériaux la solution adaptée pour borniers, conducteurs et câbles ainsi que pour appareils et installations. Les matériaux imprimés peuvent être commandés dès une unité et sont fabriqués par Phoenix Contact.","MARKING Configurator 可轻松创建 MARKING system 产品组合中的个性化打印标记解决方案。客户可从 2,000 多种材料中为端子、导线和电缆以及设备和系统选择合适的解决方案。打印好的材料起订量为一件，由 Phoenix Contact 生产。"],"Die Basisabsicherung ist der Grundstein für eine wirksame und zukunftsfähige Absicherungsstrategie von Automatisierungslösungen. Nach einem STARTER-Workshop erfolgt eine Bestandsaufnahme der Geräte und Kommunikationsverbindungen sowie eine Grundabsicherung des Netzwerks. Die Ergebnisse werden in einer Industrial-Security-Basisspezifikation dokumentiert.":["Basic protection is the foundation for an effective and future-proof security strategy for automation solutions. A STARTER workshop is followed by an inventory of devices and communication links and basic protection of the network. The results are documented in an industrial security baseline specification.","La protección básica es la base de una estrategia de seguridad eficaz y preparada para el futuro en soluciones de automatización. Tras un workshop STARTER se realiza un inventario de los dispositivos y conexiones de comunicación, así como una protección básica de la red. Los resultados se documentan en una especificación básica de seguridad industrial.","La protection de base est la pierre angulaire d'une stratégie de sécurisation efficace et pérenne des solutions d'automatisation. Après un atelier STARTER, un inventaire des appareils et des liaisons de communication est réalisé ainsi qu'une sécurisation de base du réseau. Les résultats sont documentés dans une spécification de base de sécurité industrielle.","基础防护是自动化解决方案实现有效且面向未来的安全策略的基石。在 STARTER 研讨会之后，将对设备和通信连接进行盘点，并对网络实施基础防护。结果记录在工业安全基础规范中。"],"Werden Sie zum von TÜV Rheinland zertifizierten Experten für die Implementierung von Cyber Security Funktionen. Erlernen Sie notwendige Grundlagen der Cyber Security für Industrial Automation & Control Systems (IACS) in Theorie und Praxis. Weisen Sie dieses Wissen durch ein international anerkanntes Zertifikat von TÜV Rheinland nach.":["Become a TÜV Rheinland certified expert in implementing cyber security functions. Learn the necessary fundamentals of cyber security for Industrial Automation & Control Systems (IACS) in theory and practice. Prove this knowledge with an internationally recognized certificate from TÜV Rheinland.","Conviértase en experto certificado por TÜV Rheinland en la implementación de funciones de ciberseguridad. Aprenda los fundamentos necesarios de ciberseguridad para Industrial Automation & Control Systems (IACS) en teoría y práctica. Acredite estos conocimientos con un certificado de TÜV Rheinland reconocido internacionalmente.","Devenez expert certifié TÜV Rheinland pour la mise en œuvre de fonctions de cybersécurité. Acquérez les bases nécessaires de la cybersécurité pour les Industrial Automation & Control Systems (IACS) en théorie et en pratique. Attestez ces connaissances par un certificat TÜV Rheinland reconnu à l'international.","成为经 TÜV Rheinland 认证的网络安全功能实施专家。从理论和实践两方面学习工业自动化与控制系统（IACS）网络安全的必要基础知识，并通过 TÜV Rheinland 颁发的国际认可证书证明您的能力。"],"Registrierte Kunden erhalten auf der E-Commerce-Plattform ihre aktuellen, kundenspezifischen Preisinformationen sowie Echtzeit-Updates zu Lagerbeständen und Verfügbarkeit. Lokale Bestandsinformationen unterstützen eine effiziente Lager- und Logistikplanung. Beim Checkout kann ein bevorzugtes Lieferdatum gewählt werden.":["Registered customers receive their current, customer-specific price information on the e-commerce platform as well as real-time updates on stock levels and availability. Local stock information supports efficient warehouse and logistics planning. A preferred delivery date can be selected at checkout.","Los clientes registrados reciben en la plataforma de comercio electrónico su información de precios actual y específica, así como actualizaciones en tiempo real sobre existencias y disponibilidad. La información de stock local facilita una planificación eficiente del almacén y la logística. En el checkout se puede elegir una fecha de entrega preferida.","Les clients enregistrés obtiennent sur la plateforme e-commerce leurs informations tarifaires actuelles et spécifiques ainsi que des mises à jour en temps réel des stocks et de la disponibilité. Les informations de stock locales facilitent une planification efficace de l'entreposage et de la logistique. Une date de livraison souhaitée peut être choisie lors du checkout.","注册客户可在电商平台上获取最新的客户专属价格信息，以及库存和供货情况的实时更新。本地库存信息有助于高效规划仓储和物流。结账时可选择首选交货日期。"],"Im Bereich „Markieren, Montieren und Installieren“ wird mit dem CES-Konfigurator ein individuelles Kabeleinführungssystem aus Kabeltüllen für Rund- oder AS-Interface-Leitungen und Zubehör zusammengestellt. Der Taster- und Schalter-Konfigurator nutzt den modularen Produktaufbau mit über 200 Kombinationsmöglichkeiten.":["In the “Marking, mounting and installation” area, the CES configurator is used to put together an individual cable entry system from cable grommets for round or AS-Interface cables and accessories. The pushbutton and switch configurator uses the modular product design with more than 200 possible combinations.","En el área «Marcar, montar e instalar», el configurador CES permite componer un sistema individual de entrada de cables con pasacables para cables redondos o AS-Interface y accesorios. El configurador de pulsadores e interruptores aprovecha la estructura modular del producto con más de 200 combinaciones posibles.","Dans le domaine « Repérer, monter et installer », le configurateur CES permet de composer un système d'entrée de câbles individuel à partir de passe-câbles pour câbles ronds ou AS-Interface et d'accessoires. Le configurateur de boutons-poussoirs et interrupteurs exploite la conception modulaire du produit avec plus de 200 combinaisons possibles.","在“标记、安装和布线”领域，可通过 CES 配置器使用适用于圆形电缆或 AS-Interface 电缆的电缆护套及附件组合个性化电缆引入系统。按钮和开关配置器利用模块化产品结构，提供 200 多种组合方式。"],"Phoenix Contact analysiert verkettete Anlagen und bewertet, ob eine Gesamtheit von Maschinen vorliegt. Die Ergebnisse werden dokumentiert und mit dem Kunden besprochen. Auf Wunsch unterstützt das Team mit Engineering und übernimmt Verantwortung bei der CE-Kennzeichnung als Bevollmächtigter.":["Phoenix Contact analyzes interlinked systems and assesses whether they constitute an assembly of machinery. The results are documented and discussed with the customer. On request, the team provides engineering support and assumes responsibility for CE marking as an authorized representative.","Phoenix Contact analiza instalaciones encadenadas y evalúa si se trata de un conjunto de máquinas. Los resultados se documentan y se comentan con el cliente. Si se desea, el equipo presta apoyo con ingeniería y asume la responsabilidad del marcado CE como representante autorizado.","Phoenix Contact analyse les installations interconnectées et évalue s'il s'agit d'un ensemble de machines. Les résultats sont documentés et discutés avec le client. Sur demande, l'équipe apporte un soutien en ingénierie et assume la responsabilité du marquage CE en tant que mandataire.","Phoenix Contact 分析联动设备，评估其是否构成机器组合。结果将形成文档并与客户讨论。如有需要，团队还可提供工程支持，并作为授权代表承担 CE 标志相关责任。"],"Im STARTER-Workshop beleuchtet das Experten-Team gemeinsam mit dem Kunden die zentralen Fragestellungen der Arbeitssicherheit im Unternehmen. Es werden Lösungswege aufgezeigt, die auf das Unternehmen zugeschnitten sind, um das Thema ganzheitlich und zukunftsorientiert anzugehen.":["In the STARTER workshop, the expert team works with the customer to examine the key issues of occupational safety in the company. Solutions tailored to the company are presented in order to approach the topic holistically and with a view to the future.","En el workshop STARTER, el equipo de expertos analiza junto con el cliente las cuestiones clave de la seguridad laboral en la empresa. Se presentan soluciones adaptadas a la empresa para abordar el tema de forma integral y orientada al futuro.","Lors de l'atelier STARTER, l'équipe d'experts examine avec le client les questions clés de la sécurité au travail dans l'entreprise. Des solutions adaptées à l'entreprise sont présentées afin d'aborder le sujet de manière globale et tournée vers l'avenir.","在 STARTER 研讨会上，专家团队与客户共同探讨企业职业安全的核心问题，并提出为企业量身定制的解决方案，以全面、面向未来的方式应对这一课题。"],"Phoenix Contact übernimmt verantwortlich die regelmäßige Prüfung von berührungslos wirkenden Schutzeinrichtungen (BWS) und Maschinenschutztoren. Die Techniker inspizieren, messen Nachlaufzeiten, dokumentieren die Ergebnisse und bringen nötige Schilder und Kennzeichnungen an.":["Phoenix Contact takes responsibility for the regular inspection of electro-sensitive protective equipment (ESPE) and machine guard doors. The technicians inspect, measure stopping times, document the results and attach the necessary signs and markings.","Phoenix Contact asume de forma responsable la inspección periódica de dispositivos de protección optoelectrónicos (ESPE) y puertas de protección de máquinas. Los técnicos inspeccionan, miden los tiempos de parada, documentan los resultados y colocan las señales e identificaciones necesarias.","Phoenix Contact prend en charge sous sa responsabilité le contrôle régulier des équipements de protection électro-sensibles (ESPE) et des portes de protection de machines. Les techniciens inspectent, mesurent les temps d'arrêt, documentent les résultats et apposent les panneaux et marquages nécessaires.","Phoenix Contact 负责定期检查电敏防护设备（ESPE）和机器防护门。技术人员进行检查、测量停止时间、记录结果，并安装必要的标牌和标识。"],"Neben der IT muss auch der OT-Bereich geschützt werden. Phoenix Contact bietet dafür Wissen (Leitfaden „Neun Schritte zur sicheren Anlage gemäß IEC 62443“, Kompaktseminar), einen Starter-Tag sowie Pakete von der Basisabsicherung bis zur maximalen Security.":["In addition to IT, the OT area must also be protected. For this, Phoenix Contact offers knowledge (guide “Nine steps to a secure system according to IEC 62443”, compact seminar), a starter day and packages ranging from basic protection to maximum security.","Además de la IT, también debe protegerse el área OT. Para ello, Phoenix Contact ofrece conocimientos (guía «Nueve pasos hacia una instalación segura según IEC 62443», seminario compacto), una jornada de inicio y paquetes desde la protección básica hasta la máxima seguridad.","Outre l'IT, le domaine OT doit également être protégé. Phoenix Contact propose pour cela des connaissances (guide « Neuf étapes vers une installation sécurisée selon IEC 62443 », séminaire compact), une journée de démarrage ainsi que des offres allant de la protection de base à la sécurité maximale.","除 IT 外，OT 领域同样需要保护。为此，Phoenix Contact 提供知识资源（指南“依据 IEC 62443 实现安全设备的九个步骤”、精简研讨会）、入门日以及从基础防护到最高安全级别的服务包。"],"Die Seminare richten sich an alle, die Produkte und Systemlösungen für digitale Energienetze einsetzen. Angeboten werden Grundlagen und Expertenschulungen zur Schutztechnik, ein ME-DRP-Engineer-Seminar sowie CE-konforme elektrische Ausrüstung.":["The seminars are aimed at everyone who uses products and system solutions for digital power grids. Basic and expert training on protection technology, an ME-DRP Engineer seminar and CE-compliant electrical equipment are offered.","Los seminarios están dirigidos a todas las personas que utilizan productos y soluciones de sistema para redes energéticas digitales. Se ofrecen formaciones básicas y de expertos en técnica de protección, un seminario ME-DRP Engineer y equipamiento eléctrico conforme a CE.","Les séminaires s'adressent à tous ceux qui utilisent des produits et des solutions système pour les réseaux d'énergie numériques. Sont proposés des formations de base et d'expert en technique de protection, un séminaire ME-DRP Engineer ainsi que l'équipement électrique conforme CE.","研讨会面向所有使用数字电网产品和系统解决方案的人员，提供保护技术基础和专家培训、ME-DRP Engineer 研讨会以及符合 CE 的电气设备课程。"],"Für Cobot-Applikationen unterstützt Phoenix Contact bei der sicheren Gestaltung. Neben Engineering-Leistungen wird insbesondere die Kraft- und Druckmessung durchgeführt, um die Sicherheit der Mensch-Roboter-Kollaboration nachzuweisen.":["Phoenix Contact supports the safe design of cobot applications. In addition to engineering services, force and pressure measurement in particular is carried out to verify the safety of human-robot collaboration.","Phoenix Contact presta apoyo en el diseño seguro de aplicaciones con cobots. Además de servicios de ingeniería, se realiza en particular la medición de fuerza y presión para demostrar la seguridad de la colaboración humano-robot.","Phoenix Contact accompagne la conception sûre des applications cobotiques. Outre des prestations d'ingénierie, des mesures de force et de pression sont notamment réalisées pour démontrer la sécurité de la collaboration homme-robot.","Phoenix Contact 为协作机器人应用的安全设计提供支持。除工程服务外，还特别开展力和压力测量，以证明人机协作的安全性。"],"Eine unzureichende Richtlinienkonformität kann Abnahmeprobleme beim Endkunden, Rechtsansprüche Geschädigter, Rückrufaktionen oder Betriebsverbote durch die Marktaufsicht, Regressansprüche und Geldbußen nach sich ziehen.":["Insufficient directive compliance can result in acceptance problems with the end customer, legal claims by injured parties, recalls or operating bans by market surveillance, recourse claims and fines.","Un cumplimiento insuficiente de las directivas puede acarrear problemas de aceptación con el cliente final, reclamaciones legales de perjudicados, retiradas de productos o prohibiciones de uso por parte de la vigilancia del mercado, reclamaciones de regreso y multas.","Une conformité insuffisante aux directives peut entraîner des problèmes de réception chez le client final, des actions en justice des victimes, des rappels ou des interdictions d'exploitation par la surveillance du marché, des recours et des amendes.","不充分的指令合规可能导致最终客户验收问题、受害方的法律索赔、市场监管部门的召回或禁止运行、追偿要求以及罚款。"],"Mit einem Konto bei „Mein Phoenix Contact“ lassen sich Bestellungen verwalten, Lieferstatus prüfen, Angebote anfordern, eigene Preislisten oder BMEcat-Dateien erstellen und Favoriten speichern.":["With an account at “Mein Phoenix Contact”, you can manage orders, check delivery status, request quotations, create your own price lists or BMEcat files and save favorites.","Con una cuenta en «Mein Phoenix Contact» se pueden gestionar pedidos, consultar el estado de entrega, solicitar ofertas, crear listas de precios propias o archivos BMEcat y guardar favoritos.","Avec un compte « Mein Phoenix Contact », vous pouvez gérer vos commandes, vérifier l'état de livraison, demander des offres, créer vos propres listes de prix ou fichiers BMEcat et enregistrer des favoris.","拥有“Mein Phoenix Contact”账户后，可以管理订单、查询交货状态、索取报价、创建自有价目表或 BMEcat 文件以及保存收藏。"],"Der Cyber Resilience Act (CRA) stellt Hersteller von Maschinen und Anlagen vor die Aufgabe, Cyber Security systematisch in Entwicklung, Konformitätsbewertung und Produktpflege zu integrieren.":["The Cyber Resilience Act (CRA) requires manufacturers of machines and systems to systematically integrate cyber security into development, conformity assessment and product maintenance.","El Cyber Resilience Act (CRA) plantea a los fabricantes de máquinas e instalaciones el reto de integrar sistemáticamente la ciberseguridad en el desarrollo, la evaluación de la conformidad y el mantenimiento del producto.","Le Cyber Resilience Act (CRA) impose aux fabricants de machines et d'installations d'intégrer systématiquement la cybersécurité dans le développement, l'évaluation de la conformité et le suivi des produits.","《网络弹性法案》（CRA）要求机器和设备制造商将网络安全系统性地融入开发、合格评定和产品维护之中。"],"Individuelle Kabelkonfektionen für Signal-, Daten- und Leistungsübertragung in IP6x-Umgebungen oder Schaltschrankanwendungen mit frei wählbaren Längen und Leitungsenden.":["Custom cable assemblies for signal, data and power transmission in IP6x environments rantwortliche regelmäßige Prüfung berührungslos wirkender Schutzeinrichtungen und Maschinenschutztore inklusive Messung, Dokumentation und Kennzeichnung.":["Responsible regular inspection of electro-sensitive protective equipment and machine guard doors including measurement, documentation and marking.","Inspección periódica responsable de dispositivos de protección optoelectrónicos y puertas de protección de máquinas, incluidas medición, documentación e identificación.","Contrôle régulier sous responsabilité des équipements de protection électro-sensibles et des portes de protection de machines, y compris mesure, documentation et marquage.","负责定期检查电敏防护设备和机器防护门，包括测量、记录和标识。"],"Statische BMEcat-Kataloge mit vollständigen technischen und kaufmännischen Produktdaten inkl. ECLASS/ETIM – auch als individueller Self-Service-Download.":["Static BMEcat catalogs with complete technical and commercial product data incl. ECLASS/ETIM – also as an individual self-service download.","Catálogos BMEcat estáticos con datos de producto técnicos y comerciales completos, incl. ECLASS/ETIM, también como descarga individual en autoservicio.","Catalogues BMEcat statiques avec données produit techniques et commerciales complètes, y compris ECLASS/ETIM – également en téléchargement individuel en libre-service.","静态 BMEcat 目录，含完整的技术和商务产品数据（包括 ECLASS/ETIM）——也可通过自助服务单独下载。"],"Punchout-Schnittstelle für den Zugriff aus dem ERP-System auf über 50.000 Artikel mit Echtzeit-Preisen, Verfügbarkeiten und individuellen Konditionen.":["Punchout interface for access from the ERP system to more than 50,000 items with real-time prices, availability and individual conditions.","Interfaz Punchout para acceder desde el sistema ERP a más de 50.000 artículos con precios en tiempo real, disponibilidad y condiciones individuales.","Interface Punchout pour accéder depuis le système ERP à plus de 50 000 articles avec prix en temps réel, disponibilités et conditions individuelles.","Punchout 接口，可从 ERP 系统访问 50,000 多种产
