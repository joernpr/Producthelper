en":["Qualify","Cualificar","Se qualifier","资质提升"],"Produktdaten":["Product data","Datos de producto","Données produit","产品数据"],"Serie ME-PLC":["ME-PLC series","Serie ME-PLC","Série ME-PLC","ME-PLC 系列"],"Bad Pyrmont":["Bad Pyrmont","Bad Pyrmont","Bad Pyrmont","Bad Pyrmont"],"Engineering":["Engineering","Ingeniería","Ingénierie","工程"],"MSR-Technik":["Instrumentation and control","Instrumentación y control","Instrumentation et contrôle-commande","测控技术"],"Serie ME-IO":["ME-IO series","Serie ME-IO","Série ME-IO","ME-IO 系列"],"Alle ({n})":["All ({n})","Todos ({n})","Tous ({n})","全部（{n}）"],"Markierung":["Marking","Identificación","Repérage","标记"],"Datenbank":["Database","Base de datos","Base de données","数据库"],"Paderborn":["Paderborn","Paderborn","Paderborn","Paderborn"],"Serie OCS":["OCS series","Serie OCS","Série OCS","OCS 系列"],"Werkzeuge":["Tools","Herramientas","Outils","工具"],"+ Merken":["+ Save","+ Guardar","+ Ajouter","+ 收藏"],"Beratung":["Consulting","Asesoramiento","Conseil","咨询"],"Seminare":["Seminars","Seminarios","Séminaires","研讨会"],"Software":["Software","Software","Logiciel","软件"],"Präsenz":["Classroom","Presencial","Présentiel","线下"],"Service":["Service","Servicio","Service","服务"],"Webinar":["Webinar","Webinar","Webinaire","网络研讨会"],"8 Std.":["8 hrs","8 h","8 h","8 小时"],"Leeren":["Clear","Vaciar","Vider","清空"],"Zurück":["Back","Volver","Retour","返回"],"Ende":["End","Fin","Fin","结束"],"egal":["any","indiferente","peu importe","不限"],"Die Abteilung Channel Partner Management steht dem Elektrofachgroßhandel für kaufmännische und technische Fragen zur Verfügung. Das Kundencenter erfasst, terminiert und verfolgt Aufträge und beantwortet Angebote und Gutschriften; die Technik unterstützt bei technischen Klärungen, Angeboten, Listungsvorschlägen und Projektkoordination. Der Außendienst in acht Regionen bietet Tandembesuche, Kunden- und Mitarbeiterschulungen, Thekentage/Hausmessen und Beratung vor Ort. Ergänzend: Artikelstammdaten und Preislisten, Konfiguratoren, Rücksendung/Reklamation, Veranstaltungen und digitale Kataloge.":["The Channel Partner Management department supports electrical wholesalers with commercial and technical questions. The customer center records, schedules and tracks orders and handles quotations and credit notes; the technical team assists with technical clarifications, quotations, listing proposals and project coordination. The field sales force in eight regions offers joint customer visits, customer and staff training, counter days/in-house exhibitions and on-site consulting. In addition: article master data and price lists, configurators, returns/complaints, events and digital catalogs.","El departamento Channel Partner Management atiende al comercio mayorista de material eléctrico en cuestiones comerciales y técnicas. El centro de atención al cliente registra, programa y sigue los pedidos y gestiona ofertas y abonos; el equipo técnico ayuda con aclaraciones técnicas, ofertas, propuestas de catalogación y coordinación de proyectos. El servicio comercial de campo, presente en ocho regiones, ofrece visitas conjuntas, formación para clientes y empleados, jornadas de mostrador/ferias internas y asesoramiento in situ. Además: datos maestros de artículos y listas de precios, configuradores, devoluciones/reclamaciones, eventos y catálogos digitales.","Le service Channel Partner Management accompagne les grossistes en matériel électrique pour toutes les questions commerciales et techniques. Le centre clients saisit, planifie et suit les commandes et traite les offres et avoirs ; l’équipe technique assiste pour les clarifications techniques, les offres, les propositions de référencement et la coordination de projets. Le service commercial terrain, présent dans huit régions, propose des visites conjointes, des formations clients et collaborateurs, des journées comptoir/salons internes et du conseil sur site. En complément : données de base articles et listes de prix, configurateurs, retours/réclamations, événements et catalogues numériques.","渠道合作伙伴管理部门为电气批发商提供商务和技术方面的支持。客户中心负责订单的录入、排期和跟踪，并处理报价和贷记单；技术团队协助技术澄清、报价、上架建议和项目协调。分布在八个区域的外勤销售团队提供联合拜访、客户与员工培训、柜台日/内部展会以及现场咨询。此外还提供：产品主数据和价格表、配置器、退货/投诉、活动以及数字化目录。"],"Kunden planen ihre Klemmenleiste inklusive Zubehör und Markierungen mit der Engineering-Software clipx ENGINEER und übertragen sie direkt an den Online-Shop; dort erhalten sie sofort ein Angebot mit Preis und Liefertermin. Für Standardbestellungen (ca. 10.000 Artikel) gelten acht Tage Produktionszeit, für „Fastlane 4“ (ca. 3.000 Artikel) vier Tage und für „Fastlane 2“ (600 Artikel) zwei Tage zuzüglich Lieferzeit; die Fastlanes sind nur in ausgewählten Ländern verfügbar. Der Service hilft, Auftragsspitzen zu bewältigen, Lagerbestände zu senken und Fachpersonal zu entlasten.":["Customers plan their terminal strip including accessories and markings with the clipx ENGINEER engineering software and transfer it directly to the online shop, where they immediately receive a quotation with price and delivery date. Standard orders (approx. 10,000 articles) have a production time of eight days, “Fastlane 4” (approx. 3,000 articles) four days and “Fastlane 2” (600 articles) two days, plus delivery time; the Fastlanes are only available in selected countries. The service helps handle order peaks, reduce inventory and relieve skilled staff.","Los clientes planifican su regleta de bornes, incluidos accesorios y marcados, con el software de ingeniería clipx ENGINEER y la transfieren directamente a la tienda online, donde reciben al instante una oferta con precio y fecha de entrega. Para pedidos estándar (aprox. 10.000 artículos) el plazo de producción es de ocho días, para «Fastlane 4» (aprox. 3.000 artículos) cuatro días y para «Fastlane 2» (600 artículos) dos días, más el plazo de entrega; las Fastlanes solo están disponibles en determinados países. El servicio ayuda a absorber picos de pedidos, reducir existencias y descargar al personal especializado.","Les clients conçoivent leur bornier, accessoires et repérages compris, avec le logiciel d’ingénierie clipx ENGINEER et le transfèrent directement à la boutique en ligne, où ils reçoivent immédiatement une offre avec prix et date de livraison. Les commandes standard (env. 10 000 articles) ont un délai de production de huit jours, « Fastlane 4 » (env. 3 000 articles) de quatre jours et « Fastlane 2 » (600 articles) de deux jours, hors délai de livraison ; les Fastlanes ne sont disponibles que dans certains pays. Ce service aide à absorber les pics de commandes, à réduire les stocks et à soulager le personnel qualifié.","客户使用工程软件 clipx ENGINEER 规划包括附件和标记在内的端子排，并直接传输到在线商店，即可立即获得包含价格和交货日期的报价。标准订单（约 10,000 种产品）生产周期为八天，“Fastlane 4”（约 3,000 种产品）为四天，“Fastlane 2”（600 种产品）为两天，另加运输时间；Fastlane 仅在部分国家/地区提供。该服务有助于应对订单高峰、降低库存并减轻专业人员的负担。"],"Individuelle Klemmenkästen und Gehäuse werden nach Vorgaben bearbeitet und mit projektierten Klemmenleisten oder weiteren Phoenix Contact-Produkten montiert; Gehäusematerial und Kabeldurchführung richten sich nach den Anforderungen. Grundlage sind Excel/PDF-Unterlagen, eine ECAD-Stückliste, eine Zeichnung oder eine PROJECT complete-Datei. Experten beraten, prüfen und fassen die Lösung unter einer Artikelnummer zusammen; anschließend wird sie einsatzbereit gefertigt. Eine Checkliste für Gehäuselösungen unterstützt die Angebotsanfrage.":["Customized terminal boxes and enclosures are machined to specification and fitted with configured terminal strips or other Phoenix Contact products; enclosure material and cable entry are chosen according to requirements. The basis is Excel/PDF documents, an ECAD bill of materials, a drawing or a PROJECT complete file. Experts advise, review and combine the solution under a single article number; it is then manufactured ready for use. A checklist for enclosure solutions supports the quotation request.","Las cajas de bornes y envolventes personalizadas se mecanizan según especificaciones y se montan con regletas de bornes configuradas u otros productos de Phoenix Contact; el material de la envolvente y la entrada de cables se adaptan a los requisitos. La base son documentos Excel/PDF, una lista de materiales ECAD, un plano o un archivo PROJECT complete. Los expertos asesoran, revisan y agrupan la solución bajo un único número de artículo; a continuación se fabrica lista para usar. Una lista de comprobación para soluciones de envolventes facilita la solicitud de oferta.","Les boîtes de jonction et boîtiers personnalisés sont usinés selon les spécifications et équipés de borniers configurés ou d’autres produits Phoenix Contact ; le matériau du boîtier et l’entrée de câbles sont choisis selon les exigences. La base peut être des documents Excel/PDF, une nomenclature ECAD, un plan ou un fichier PROJECT complete. Des experts conseillent, vérifient et regroupent la solution sous une seule référence ; elle est ensuite fabriquée prête à l’emploi. Une check-list pour les solutions de boîtiers facilite la demande d’offre.","根据规格对定制接线盒和外壳进行加工，并装配已配置的端子排或其他 Phoenix Contact 产品；外壳材料和电缆入口按要求选择。依据可以是 Excel/PDF 文档、ECAD 物料清单、图纸或 PROJECT complete 文件。专家提供咨询和审核，并将解决方案归入一个产品编号；随后制造成即装即用的成品。外壳解决方案检查清单可为询价提供帮助。"],"Mit der Registrierung erhalten Nutzende Zugang zum Self-Service-Bereich „Mein Phoenix Contact“. Registrierte Nutzende können technische Daten und Varianten präzise vergleichen und relevante Produkte in persönlichen Produktlisten für spätere Projekte speichern. Das Business-Konto ist Voraussetzung für Preise, Bestellung, Bestellverfolgung, Retouren und die Self-Services Preisliste und BMEcat. Für Preise und Bestellfunktionen ist zusätzlich die Freigabe einer Kundennummer durch Administratoren nötig.":["Registering gives users access to the self-service area “Mein Phoenix Contact”. Registered users can compare technical data and variants precisely and save relevant products in personal product lists for future projects. A business account is required for prices, ordering, order tracking, returns and the price list and BMEcat self-services. Prices and ordering functions additionally require a customer number to be approved by administrators.","Con el registro, los usuarios obtienen acceso al área de autoservicio «Mein Phoenix Contact». Los usuarios registrados pueden comparar con precisión datos técnicos y variantes y guardar productos relevantes en listas de productos personales para proyectos futuros. La cuenta Business es necesaria para precios, pedidos, seguimiento de pedidos, devoluciones y los autoservicios de lista de precios y BMEcat. Para precios y funciones de pedido se requiere además que los administradores autoricen un número de cliente.","L’inscription donne accès à l’espace self-service « Mein Phoenix Contact ». Les utilisateurs inscrits peuvent comparer précisément les données techniques et les variantes et enregistrer les produits pertinents dans des listes personnelles pour de futurs projets. Le compte Business est requis pour les prix, les commandes, le suivi des commandes, les retours et les self-services liste de prix et BMEcat. Pour les prix et les fonctions de commande, un numéro client doit en outre être validé par les administrateurs.","注册后，用户可访问自助服务区“Mein Phoenix Contact”。注册用户可以精确比较技术数据和型号，并将相关产品保存到个人产品列表中，供日后项目使用。查看价格、下单、订单跟踪、退货以及价格表和 BMEcat 自助服务均需企业账户。此外，价格和订购功能还需要管理员批准客户编号。"],"Der Leitfaden fasst zentrales Wissen für den Maschinen- und Schaltschrankbau kompakt zusammen, ergänzt um aktuelle Informationen zur neuen EU-Maschinenverordnung. Er beschreibt die zentralen Schritte der CE-Kennzeichnung, die Ermittlung relevanter Richtlinien und harmonisierter Normen sowie Unternehmensrisiken bei fehlender CE-Kennzeichnung. Verfügbar als PDF (ca. 30 Minuten Lesezeit), als gedrucktes A1-Poster oder als 60-minütige Videoaufzeichnung des CE-Kompaktseminars.":["The guide summarizes key knowledge for machine and control cabinet building in compact form, supplemented by current information on the new EU Machinery Regulation. It describes the main steps of CE marking, how to identify relevant directives and harmonized standards, and the business risks of missing CE marking. Available as a PDF (approx. 30 minutes reading time), as a printed A1 poster or as a 60-minute video recording of the CE compact seminar.","La guía resume de forma compacta los conocimientos clave para la construcción de máquinas y armarios de control, complementados con información actualizada sobre el nuevo Reglamento de Máquinas de la UE. Describe los pasos principales del marcado CE, la identificación de directivas y normas armonizadas relevantes y los riesgos empresariales de no contar con el marcado CE. Disponible en PDF (aprox. 30 minutos de lectura), como póster A1 impreso o como grabación en vídeo de 60 minutos del seminario compacto de CE.","Ce guide résume de manière compacte les connaissances essentielles pour la construction de machines et d’armoires électriques, complétées par des informations actuelles sur le nouveau règlement européen Machines. Il décrit les principales étapes du marquage CE, l’identification des directives et normes harmonisées pertinentes ainsi que les risques pour l’entreprise en l’absence de marquage CE. Disponible en PDF (env. 30 minutes de lecture), en poster A1 imprimé ou en enregistrement vidéo de 60 minutes du séminaire compact CE.","本指南简明汇总了机械制造和控制柜制造的核心知识，并补充了有关新版欧盟机械法规的最新信息。内容涵盖 CE 标志的主要步骤、相关指令和协调标准的确定，以及缺少 CE 标志给企业带来的风险。提供 PDF 版（阅读约 30 分钟）、A1 印刷海报以及 60 分钟 CE 精要研讨会视频录像。"],"Im Rahmen der Normen-Services stellt Phoenix Contact den aktuellen Normungsstand zentraler Normen der Maschinensicherheit mit Änderungsinformationen und Handlungsempfehlungen bereit. Im Fokus stehen u. a. EN ISO 12100, EN ISO 13849-1/-2, EN 62061 und EN 60204-1. Über den Safety-Newsletter informiert das Experten-Team regelmäßig über Normenänderungen. Darüber hinaus beantworten die Experten, welche Richtlinien und Normen für das jeweilige Produkt relevant sind.":["As part of its standards services, Phoenix Contact provides the current status of key machine safety standards with change information and recommended actions. The focus includes EN ISO 12100, EN ISO 13849-1/-2, EN 62061 and EN 60204-1. The expert team regularly reports on changes to standards via the Safety newsletter. The experts also advise which directives and standards are relevant for a given product.","En el marco de sus servicios de normas, Phoenix Contact ofrece el estado actual de las principales normas de seguridad de máquinas con información sobre cambios y recomendaciones de actuación. Se centra, entre otras, en EN ISO 12100, EN ISO 13849-1/-2, EN 62061 y EN 60204-1. El equipo de expertos informa periódicamente sobre cambios normativos a través del boletín Safety. Además, los expertos indican qué directivas y normas son relevantes para cada producto.","Dans le cadre de ses services normes, Phoenix Contact fournit l’état actuel des principales normes de sécurité des machines, avec informations sur les modifications et recommandations d’action. L’accent est mis notamment sur EN ISO 12100, EN ISO 13849-1/-2, EN 62061 et EN 60204-1. L’équipe d’experts informe régulièrement des évolutions normatives via la newsletter Safety. Les experts indiquent en outre quelles directives et normes s’appliquent au produit concerné.","作为标准服务的一部分，Phoenix Contact 提供机械安全核心标准的最新状态，包括变更信息和行动建议。重点包括 EN ISO 12100、EN ISO 13849-1/-2、EN 62061 和 EN 60204-1。专家团队通过 Safety 简报定期通报标准变更。此外，专家还会解答哪些指令和标准适用于具体产品。"],"Im Advanced Workshop werden Themen individuell festgelegt, z. B. IEC-61131-3-Entwicklung, Hochsprachen (C++, C#, Python), Systemschnittstellen (gRPC, REST), OCI-Container, Feldbus- und Cloud-Anbindungen, PLCnext Apps und HMIs. Dauer 4 Stunden, bis zu 8 Personen, online per Microsoft Teams; Preis 1.549,00 Euro zzgl. MwSt. inklusive Vorbereitung, Durchführung und Nachbereitung. Auf Anfrage auch vor Ort oder an einem Phoenix Contact Standort.":["In the Advanced Workshop, topics are defined individually, e.g. IEC 61131-3 development, high-level languages (C++, C#, Python), system interfaces (gRPC, REST), OCI containers, fieldbus and cloud connections, PLCnext Apps and HMIs. Duration 4 hours, up to 8 participants, online via Microsoft Teams; price EUR 1,549.00 plus VAT, including preparation, delivery and follow-up. On request also on site or at a Phoenix Contact location.","En el Advanced Workshop los temas se definen de forma individual, p. ej., desarrollo IEC 61131-3, lenguajes de alto nivel (C++, C#, Python), interfaces de sistema (gRPC, REST), contenedores OCI, conexiones de bus de campo y nube, PLCnext Apps y HMI. Duración 4 horas, hasta 8 personas, online a través de Microsoft Teams; precio 1.549,00 euros más IVA, incluidos preparación, realización y seguimiento. Bajo petición, también in situ o en una sede de Phoenix Contact.","Dans l’Advanced Workshop, les thèmes sont définis individuellement, p. ex. développement IEC 61131-3, langages évolués (C++, C#, Python), interfaces système (gRPC, REST), conteneurs OCI, connexions bus de terrain et cloud, PLCnext Apps et IHM. Durée 4 heures, jusqu’à 8 personnes, en ligne via Microsoft Teams ; prix 1 549,00 euros HT, préparation, réalisation et suivi compris. Sur demande, également sur site ou sur un site Phoenix Contact.","高级研讨会的主题可单独确定，例如 IEC 61131-3 开发、高级语言（C++、C#、Python）、系统接口（gRPC、REST）、OCI 容器、现场总线和云连接、PLCnext Apps 及 HMI。时长 4 小时，最多 8 人，通过 Microsoft Teams 在线进行；价格 1,549.00 欧元（不含增值税），包括准备、实施和后续跟进。可应要求在现场或 Phoenix Contact 所在地举办。"],"Phoenix Contact stellt Produktdaten in den Portalen bzw. Datenbanken der CAE-Anbieter bereit, u. a. für AmpereSoft, Aucotec Engineering Base, AutoCAD Electrical, EPLAN (P8-Dateigenerator, EPLAN Data Portal), ETAP/SEE Electrical, SDProget SPAC, Siemens NX, WSCAD und ZUKEN. Ergänzend gibt es Klassifikationen nach ECLASS und die Erstellung von BMEcat-Dateien. Die Daten lassen sich schnell in das eigene Engineering-System einbinden.":["Phoenix Contact provides product data in the portals and databases of CAE vendors, including AmpereSoft, Aucotec Engineering Base, AutoCAD Electrical, EPLAN (P8 file generator, EPLAN Data Portal), ETAP/SEE Electrical, SDProget SPAC, Siemens NX, WSCAD and ZUKEN. In addition, there are ECLASS classifications and the creation of BMEcat files. The data can be integrated quickly into your own engineering system.","Phoenix Contact pone a disposición datos de producto en los portales y bases de datos de los proveedores de CAE, entre otros AmpereSoft, Aucotec Engineering Base, AutoCAD Electrical, EPLAN (generador de archivos P8, EPLAN Data Portal), ETAP/SEE Electrical, SDProget SPAC, Siemens NX, WSCAD y ZUKEN. Además, se ofrecen clasificaciones según ECLASS y la creación de archivos BMEcat. Los datos se integran rápidamente en el propio sistema de ingeniería.","Phoenix Contact met à disposition des données produits dans les portails et bases de données des éditeurs CAE, notamment AmpereSoft, Aucotec Engineering Base, AutoCAD Electrical, EPLAN (générateur de fichiers P8, EPLAN Data Portal), ETAP/SEE Electrical, SDProget SPAC, Siemens NX, WSCAD et ZUKEN. S’y ajoutent des classifications ECLASS et la création de fichiers BMEcat. Les données s’intègrent rapidement dans votre propre système d’ingénierie.","Phoenix Contact 在各 CAE 供应商的门户和数据库中提供产品数据，包括 AmpereSoft、Aucotec Engineering Base、AutoCAD Electrical、EPLAN（P8 文件生成器、EPLAN Data Portal）、ETAP/SEE Electrical、SDProget SPAC、Siemens NX、WSCAD 和 ZUKEN。此外还提供 ECLASS 分类和 BMEcat 文件生成。数据可快速集成到您自己的工程系统中。"],"Eine Wartung umfasst die Prüfung von Firmware, Treiber und Markierungs-Software, der Bedienung mit dem verwendeten Material sowie Sichtprüfung und Funktionstest. Reparaturen erfolgen je nach Druckertyp vor Ort oder in einem weltweiten Service-Center; der Kunde erhält einen detaillierten Bericht über Arbeitsschritte und ersetzte Teile. Servicepakete kombinieren Installation, regelmäßige Wartungen und kostenfreie Reparaturen.":["Maintenance includes checking firmware, drivers and marking software, operation with the materials used, as well as a visual inspection and function test. Depending on the printer type, repairs are carried out on site or at a worldwide service center; the customer receives a detailed report on work steps and replaced parts. Service packages combine installation, regular maintenance and free repairs.","El mantenimiento incluye la comprobación de firmware, controladores y software de marcado, del manejo con el material utilizado, así como una inspección visual y una prueba de funcionamiento. Según el tipo de impresora, las reparaciones se realizan in situ o en un centro de servicio a nivel mundial; el cliente recibe un informe detallado de los trabajos realizados y las piezas sustituidas. Los paquetes de servicio combinan instalación, mantenimientos periódicos y reparaciones gratuitas.","La maintenance comprend la vérification du firmware, des pilotes et du logiciel de marquage, de l’utilisation avec les consommables employés, ainsi qu’un contrôle visuel et un test de fonctionnement. Selon le type d’imprimante, les réparations sont effectuées sur site ou dans un centre de service dans le monde entier ; le client reçoit un rapport détaillé des opérations et des pièces remplacées. Les packs de services combinent installation, maintenances régulières et réparations gratuites.","维护包括检查固件、驱动程序和标记软件、使用所用耗材的操作情况，以及外观检查和功能测试。根据打印机类型，维修可在现场或全球服务中心进行；客户将收到关于工作步骤和更换部件的详细报告。服务套餐包含安装、定期维护和免费维修。"],"Phoenix Contact unterstützt die Rückführung von Altprodukten in den Recyclingkreislauf – auch für Altgeräte, die nicht direkt bei Phoenix Contact gekauft wurden. Die Rücksendung muss vorab angemeldet und als „Rückgabe zur Verschrottung gemäß WEEE-Richtlinie“ gekennzeichnet werden. Personenbezogene Daten sind vorher zu löschen, Batterien möglichst zu entnehmen und Lithium-Ionen-Akkus als Gefahrgut zu kennzeichnen.":["Phoenix Contact supports returning end-of-life products to the recycling loop – including old devices not purchased directly from Phoenix Contact. The return must be registered in advance and labeled as “Return for scrapping in accordance with the WEEE Directive”. Personal data must be deleted beforehand, batteries removed where possible and lithium-ion batteries labeled as dangerous goods.","Phoenix Contact apoya la reincorporación de productos usados al ciclo de reciclaje, también de aparatos que no se compraron directamente a Phoenix Contact. La devolución debe notificarse previamente e identificarse como «Devolución para desguace conforme a la Directiva RAEE». Antes deben borrarse los datos personales, retirarse las baterías en la medida de lo posible y marcarse las baterías de iones de litio como mercancía peligrosa.","Phoenix Contact soutient la réintégration des produits usagés dans le circuit de recyclage – y compris les appareils qui n’ont pas été achetés directement auprès de Phoenix Contact. Le retour doit être annoncé au préalable et identifié comme « Retour pour mise au rebut conformément à la directive DEEE ». Les données personnelles doivent être supprimées au préalable, les piles retirées si possible et les batteries lithium-ion signalées comme marchandises dangereuses.","Phoenix Contact 支持将废旧产品回收再利用——包括并非直接从 Phoenix Contact 购买的旧设备。退货须事先登记，并标注“根据 WEEE 指令退回报废”。事先须删除个人数据，尽可能取出电池，并将锂离子电池标记为危险品。"],"Mit clipx ENGINEER werden Klemmenleisten, bestückte Montageplatten und Klemmenkästen geplant, bestellt und die Daten nahtlos in die Fertigung übertragen – an jedem Arbeitsort. Intelligente Schnittstellen zu ECAD-Programmen sowie zu Phoenix Contact-Anwendungen und -Konfiguratoren beschleunigen die Planung. Die Software ist Basis für den Klemmenleistenservice und für vorgefertigte Tragschienen.":["With clipx ENGINEER, terminal strips, populated mounting plates and terminal boxes are planned and ordered, and the data is transferred seamlessly to production – from any workplace. Intelligent interfaces to ECAD programs and to Phoenix Contact applications and configurators speed up planning. The software is the basis for the terminal strip service and for pre-assembled DIN rails.","Con clipx ENGINEER se planifican y piden regletas de bornes, placas de montaje equipadas y cajas de bornes, y los datos se transfieren sin interrupciones a la producción, desde cualquier lugar de trabajo. Las interfaces inteligentes con programas ECAD y con aplicaciones y configuradores de Phoenix Contact agilizan la planificación. El software es la base del servicio de regletas de bornes y de los carriles premontados.","Avec clipx ENGINEER, borniers, plaques de montage équipées et boîtes de jonction sont conçus et commandés, et les données sont transmises sans rupture à la production – depuis n’importe quel poste de travail. Des interfaces intelligentes avec les logiciels ECAD ainsi qu’avec les applications et configurateurs Phoenix Contact accélèrent la conception. Le logiciel est la base du service borniers et des rails préassemblés.","借助 clipx ENGINEER，可在任何工作地点规划和订购端子排、已装配的安装板和接线盒，并将数据无缝传输至生产环节。与 ECAD 程序以及 Phoenix Contact 应用和配置器的智能接口可加快规划速度。该软件是端子排服务和预装导轨的基础。"],"Der Warenkorb lässt sich individuell befüllen; pro Position und für die gesamte Bestellung können einmalige oder dauerhafte Referenzen vergeben werden. Bestellungen lassen sich für Kalkulation und Analyse nach Excel exportieren. Wunschliefertermine sowie Teil- und Komplettlieferungseinstellungen werden nach Möglichkeit berücksichtigt; abgewickelt wird mit den hinterlegten Firmendaten.":["The shopping cart can be filled individually; one-time or permanent references can be assigned per line item and for the entire order. Orders can be exported to Excel for calculation and analysis. Requested delivery dates as well as partial and complete delivery settings are taken into account where possible; orders are processed using the stored company data.","El carrito puede llenarse de forma individual; por posición y para todo el pedido pueden asignarse referencias puntuales o permanentes. Los pedidos pueden exportarse a Excel para cálculo y análisis. Las fechas de entrega deseadas y la configuración de entregas parciales y completas se tienen en cuenta en la medida de lo posible; la tramitación se realiza con los datos de empresa registrados.","Le panier se remplit de façon personnalisée ; des références ponctuelles ou permanentes peuvent être attribuées par ligne et pour l’ensemble de la commande. Les commandes peuvent être exportées vers Excel pour calcul et analyse. Les dates de livraison souhaitées ainsi que les paramètres de livraison partielle ou complète sont pris en compte dans la mesure du possible ; le traitement s’effectue avec les données d’entreprise enregistrées.","购物车可灵活添加产品；可为每个行项目及整个订单设置一次性或永久参考号。订单可导出至 Excel 用于核算和分析。系统会尽可能考虑期望交货日期以及部分交货和完整交货设置；订单按已保存的公司数据处理。"],"Sie brauchen Sicherheit im Umgang mit industriellen Netzwerken? Sie möchten die aktuellen Security-Mechanismen verstehen und zielgerichtet anwenden? Unsere Trainer kommen aus der Automatisierungstechnik und zeigen Ihnen aus der Sicht des Praktikers, was bei der Planung und Inbetriebnahme sicherer Netzwerke zu beachten ist und wie sie Ihre Anlage gegen Cyberangriffe absichern.":["Do you need confidence in handling industrial networks? Would you like to understand current security mechanisms and apply them in a targeted way? Our trainers come from automation technology and show you, from a practitioner’s perspective, what to consider when planning and commissioning secure networks and how to protect your system against cyberattacks.","¿Necesita seguridad en el manejo de redes industriales? ¿Desea comprender los mecanismos de seguridad actuales y aplicarlos de forma específica? Nuestros formadores proceden de la automatización y le muestran, desde la perspectiva práctica, qué tener en cuenta en la planificación y puesta en marcha de redes seguras y cómo proteger su instalación frente a ciberataques.","Vous souhaitez maîtriser les réseaux industriels en toute confiance ? Comprendre les mécanismes de sécurité actuels et les appliquer de manière ciblée ? Nos formateurs, issus de l’automatisation, vous montrent du point de vue du praticien ce qu’il faut prendre en compte lors de la conception et de la mise en service de réseaux sécurisés et comment protéger votre installation contre les cyberattaques.","您是否需要熟练掌握工业网络的使用？是否希望了解当前的安全机制并有针对性地加以应用？我们的培训师来自自动化技术领域，将从实践者的角度向您展示规划和调试安全网络时需要注意的事项，以及如何保护您的设备免受网络攻击。"],"Vier Konfiguratoren decken kupferbasierte Datenkabel (SPE, HDMI, USB, Koaxial, M12, RJ45), LWL-Datenkabel (0,5 bis 1.000 m, u. a. FSMA, LC, SC, M17, SC-RJ), M12-Power-Kabel (bis 16 A bzw. 690 V, AC- und DC-Kodierungen) sowie Sensor-/Aktor-Kabel (M8, M12, DEUTSCH, Ventilstecker, Superseal) ab. Leitungslängen, Leitungsenden und Leitungsqualitäten sind frei wählbar.":["Four configurators cover copper-based data cables (SPE, HDMI, USB, coaxial, M12, RJ45), fiber optic data cables (0.5 to 1,000 m, incl. FSMA, LC, SC, M17, SC-RJ), M12 power cables (up to 16 A or 690 V, AC and DC codings) and sensor/actuator cables (M8, M12, DEUTSCH, valve connectors, Superseal). Cable lengths, cable ends and cable qualities can be freely selected.","Cuatro configuradores abarcan cables de datos de cobre (SPE, HDMI, USB, coaxial, M12, RJ45), cables de datos de fibra óptica (de 0,5 a 1.000 m, entre otros FSMA, LC, SC, M17, SC-RJ), cables de potencia M12 (hasta 16 A o 690 V, codificaciones AC y DC) y cables de sensores/actuadores (M8, M12, DEUTSCH, conectores de válvula, Superseal). Longitudes, extremos y calidades de cable se eligen libremente.","Quatre configurateurs couvrent les câbles de données cuivre (SPE, HDMI, USB, coaxial, M12, RJ45), les câbles de données fibre optique (0,5 à 1 000 m, notamment FSMA, LC, SC, M17, SC-RJ), les câbles de puissance M12 (jusqu’à 16 A ou 690 V, codages AC et DC) ainsi que les câbles capteurs/actionneurs (M8, M12, DEUTSCH, connecteurs pour électrovannes, Superseal). Longueurs, extrémités et qualités de câble sont librement sélectionnables.","四款配置器涵盖铜质数据电缆（SPE、HDMI、USB、同轴、M12、RJ45）、光纤数据电缆（0.5 至 1,000 m，包括 FSMA、LC、SC、M17、SC-RJ）、M12 电源电缆（最高 16 A 或 690 V，AC 和 DC 编码）以及传感器/执行器电缆（M8、M12、DEUTSCH、阀门连接器、Superseal）。电缆长度、电缆端头和电缆品质均可自由选择。"],"Die Auftragsverfolgung bietet eine Übersicht über alle Bestellungen inklusive des aktuellen Status jeder Position, z. B. „Versand in Vorbereitung“. Präzise Lieferinformationen umfassen auch Teillieferungen. Bestellungen lassen sich nach Liefer- oder Bestellnummern sowie Artikeln suchen und filtern; für viele Spediteure gibt es direkte Tracking-Links.":["Order tracking provides an overview of all orders, including the current status of each line item, e.g. “Shipment in preparation”. Precise delivery information also covers partial deliveries. Orders can be searched and filtered by delivery or order numbers and by articles; direct tracking links are available for many carriers.","El seguimiento de pedidos ofrece una visión general de todos los pedidos, incluido el estado actual de cada posición, p. ej., «Envío en preparación». La información de entrega precisa incluye también entregas parciales. Los pedidos pueden buscarse y filtrarse por números de entrega o de pedido y por artículos; para muchos transportistas hay enlaces de seguimiento directos.","Le suivi des commandes offre une vue d’ensemble de toutes les commandes, y compris le statut actuel de chaque ligne, p. ex. « Expédition en préparation ». Les informations de livraison précises incluent aussi les livraisons partielles. Les commandes peuvent être recherchées et filtrées par numéro de livraison ou de commande et par article ; des liens de suivi directs existent pour de nombreux transporteurs.","订单跟踪提供所有订单的概览，包括每个行项目的当前状态，例如“正在准备发货”。精确的交货信息也涵盖部分交货。可按交货单号、订单号及产品搜索和筛选订单；许多承运商提供直接跟踪链接。"],"Bei Fernwartungslösungen sind neben technischen Komponenten auch organisatorische Maßnahmen zu berücksichtigen. Phoenix Contact unterstützt ganzheitlich im gesamten Prozess – vom STARTER-Workshop über Bestandsaufnahme, Schutzbedarfs-, Bedrohungs- und Risikoanalyse bis zum Security-Konzept mit Fokus Fernwartung. Alle Schritte werden dokumentiert.":["Remote maintenance solutions require organizational measures in addition to technical components. Phoenix Contact provides holistic support throughout the entire process – from the STARTER workshop through inventory, protection needs, threat and risk analysis to the security concept with a focus on remote maintenance. All steps are documented.","En las soluciones de mantenimiento remoto, además de los componentes técnicos deben tenerse en cuenta medidas organizativas. Phoenix Contact ofrece un apoyo integral en todo el proceso: desde el taller STARTER, pasando por el inventario y el análisis de necesidades de protección, amenazas y riesgos, hasta el concepto de seguridad centrado en el mantenimiento remoto. Todos los pasos se documentan.","Pour les solutions de télémaintenance, il faut tenir compte de mesures organisationnelles en plus des composants techniques. Phoenix Contact vous accompagne de manière globale tout au long du processus – de l’atelier STARTER à l’état des lieux, à l’analyse des besoins de protection, des menaces et des risques, jusqu’au concept de sécurité axé sur la télémaintenance. Toutes les étapes sont documentées.","远程维护解决方案除技术组件外，还需考虑组织措施。Phoenix Contact 在整个过程中提供全面支持——从 STARTER 研讨会、现状评估、防护需求分析、威胁和风险分析，直至以远程维护为重点的安全方案。所有步骤均有文档记录。"],"In unserem 2-stündigen Webinar vermitteln wir Ihnen die Grundlagen anhand von praktischen Beispielen und Live-Demos. Wir demonstrieren Schritt für Schritt die Basis-Funktionen eines mGuard-Routers incl. seiner Security-Funktionen. Dabei werden exemplarisch Verbindungen zwischen mehreren Ethernet-Netzwerken aufgebaut.":["In our 2-hour webinar, we teach you the fundamentals using practical examples and live demos. We demonstrate step by step the basic functions of an mGuard router, including its security functions. Connections between multiple Ethernet networks are set up as examples.","En nuestro webinar de 2 horas le transmitimos los fundamentos mediante ejemplos prácticos y demostraciones en directo. Mostramos paso a paso las funciones básicas de un router mGuard, incluidas sus funciones de seguridad. A modo de ejemplo, se establecen conexiones entre varias redes Ethernet.","Dans notre webinaire de 2 heures, nous vous transmettons les bases à l’aide d’exemples pratiques et de démonstrations en direct. Nous présentons pas à pas les fonctions de base d’un routeur mGuard, y compris ses fonctions de sécurité. Des connexions entre plusieurs réseaux Ethernet sont établies à titre d’exemple.","在我们 2 小时的网络研讨会中，我们将通过实际示例和现场演示向您传授基础知识。我们将逐步演示 mGuard 路由器的基本功能，包括其安全功能，并以示例方式建立多个以太网网络之间的连接。"],"Die Seminare behandeln den ganzheitlichen Schutz von Gebäuden und Anlagen vor Blitzeinschlägen und Überspannungen. Phoenix Contact ist anerkannter und zertifizierter Seminarpartner des ZVEH, die Seminare dienen dem Erhalt der Qualifikation. Das Angebot reicht von Grundlagen bis zu Messungen an Erdungsanlagen.":["The seminars cover the comprehensive protection of buildings and systems against lightning strikes and surge voltages. Phoenix Contact is a recognized and certified seminar partner of the ZVEH; the seminars serve to maintain qualifications. The offering ranges from fundamentals to measurements on earthing systems.","Los seminarios tratan la protección integral de edificios e instalaciones frente a descargas de rayos y sobretensiones. Phoenix Contact es socio de seminarios reconocido y certificado de la ZVEH; los seminarios sirven para mantener la cualificación. La oferta abarca desde los fundamentos hasta las mediciones en sistemas de puesta a tierra.","Les séminaires traitent de la protection globale des bâtiments et installations contre la foudre et les surtensions. Phoenix Contact est partenaire de séminaires reconnu et certifié du ZVEH ; les séminaires permettent de maintenir les qualifications. L’offre va des bases jusqu’aux mesures sur les installations de mise à la terre.","研讨会涵盖建筑物和设备防雷击及防浪涌的全面保护。Phoenix Contact 是 ZVEH 认可和认证的研讨会合作伙伴，研讨会有助于保持资质。课程范围从基础知识到接地系统测量。"],"Das Seminarangebot ist in Kategorien gegliedert, unter anderem Arbeitssicherheit, Automatisierungssysteme, CE-Kennzeichnung, Energie, Gebäudemanagement, Industrial Security und Netzwerktechnik, Prozesssicherheit und Explosionsschutz, Schaltschrankbau sowie Überspannungsschutz und Erdung.":["The seminar portfolio is organized into categories, including occupational safety, automation systems, CE marking, energy, building management, industrial security and network technology, process safety and explosion protection, control cabinet building, and surge protection and earthing.","La oferta de seminarios se organiza en categorías, entre ellas seguridad laboral, sistemas de automatización, marcado CE, energía, gestión de edificios, seguridad industrial y tecnología de redes, seguridad de procesos y protección contra explosiones, construcción de armarios de control, y protección contra sobretensiones y puesta a tierra.","L’offre de séminaires est structurée en catégories, notamment sécurité au travail, systèmes d’automatisation, marquage CE, énergie, gestion technique du bâtiment, sécurité industrielle et technologie réseau, sécurité des procédés et protection contre les explosions, construction d’armoires électriques, ainsi que protection contre les surtensions et mise à la terre.","研讨会按类别划分，包括职业安全、自动化系统、CE 标志、能源、楼宇管理、工业安全与网络技术、过程安全与防爆、控制柜制造以及浪涌保护与接地。"],"Liegt eine Maschine ohne CE-Kennzeichnung vor, analysieren die CE-Experten den individuellen Fall. Darauf aufbauend wird eine Lösung entwickelt, mit der der Betreiber bzw. Hersteller auf pragmatischem Weg Rechtskonformität erreicht. Der Einstieg erfolgt über ein kostenloses Erstgespräch.":["If a machine lacks CE marking, the CE experts analyze the individual case. Based on this, a solution is developed that enables the operator or manufacturer to achieve legal compliance pragmatically. It starts with a free initial consultation.","Si una máquina no tiene marcado CE, los expertos en CE analizan el caso concreto. A partir de ahí se desarrolla una solución con la que el operador o fabricante alcanza la conformidad legal de forma pragmática. El punto de partida es una primera consulta gratuita.","Si une machine ne dispose pas de marquage CE, les experts CE analysent le cas individuel. Sur cette base, une solution est élaborée pour permettre à l’exploitant ou au fabricant d’atteindre la conformité légale de manière pragmatique. Le point de départ est un premier entretien gratuit.","如果机器缺少 CE 标志，CE 专家将分析具体情况，并据此制定解决方案，帮助运营方或制造商以务实的方式实现合规。服务从免费初步咨询开始。"],"Die Seminare vermitteln praxisnahes Know-how zu den Anforderungen der funktionalen Sicherheit in der Prozessindustrie nach IEC 61511 sowie zur Erstellung und Bewertung von SIL-Nachweisen nach IEC 61508 und IEC 61511. Inhouse-Durchführung und Consulting sind möglich.":["The seminars provide practical know-how on the requirements of functional safety in the process industry according to IEC 61511, and on preparing and evaluating SIL verifications according to IEC 61508 and IEC 61511. In-house delivery and consulting are available.","Los seminarios transmiten conocimientos prácticos sobre los requisitos de seguridad funcional en la industria de procesos según IEC 61511, así como sobre la elaboración y evaluación de verificaciones SIL según IEC 61508 e IEC 61511. Es posible la realización in company y la consultoría.","Les séminaires transmettent un savoir-faire pratique sur les exigences de sécurité fonctionnelle dans l’industrie des procédés selon IEC 61511, ainsi que sur l’élaboration et l’évaluation de justificatifs SIL selon IEC 61508 et IEC 61511. Formation en intra-entreprise et conseil possibles.","研讨会传授过程工业中符合 IEC 61511 的功能安全要求的实用知识，以及依据 IEC 61508 和 IEC 61511 编制和评估 SIL 验证的方法。可提供企业内训和咨询服务。"],"Das CE-Team von Phoenix Contact begleitet produktunabhängig auf dem ganzen Weg zur CE-Kennzeichnung, umfassend oder nur in einzelnen Schritten: von der Beratung über die Konzepterstellung bis zur normgerechten Nachweisdokumentation inklusive Betriebsanleitung.":["The Phoenix Contact CE team provides product-independent support all the way to CE marking, either comprehensively or for individual steps only: from consulting and concept development to standard-compliant verification documentation, including operating instructions.","El equipo CE de Phoenix Contact le acompaña, con independencia del producto, en todo el camino hacia el marcado CE, de forma integral o solo en pasos concretos: desde el asesoramiento y la elaboración del concepto hasta la documentación de verificación conforme a normas, incluido el manual de instrucciones.","L’équipe CE de Phoenix Contact vous accompagne, indépendamment des produits, tout au long du parcours vers le marquage CE, de manière complète ou pour certaines étapes seulement : du conseil à l’élaboration du concept jusqu’à la documentation de preuve conforme aux normes, notice d’utilisation comprise.","Phoenix Contact CE 团队提供与产品无关的支持，全程或分步协助完成 CE 标志：从咨询、方案制定，到符合标准的证明文件（包括使用说明书）。"],"Die NIS2-Richtlinie verschärft die Anforderungen an die Cyber Security von Betreibern kritischer und wichtiger Unternehmen als auch kommunaler Versorgungsunternehmen und macht Informationssicherheit zu einer zentralen Organisationsaufgabe.":["The NIS2 Directive tightens cyber security requirements for operators of critical and important entities as well as municipal utilities, making information security a central organizational task.","La Directiva NIS2 endurece los requisitos de ciberseguridad para operadores de entidades críticas e importantes, así como para empresas municipales de suministro, y convierte la seguridad de la información en una tarea organizativa central.","La directive NIS2 renforce les exigences de cybersécurité pour les exploitants d’entités critiques et importantes ainsi que pour les régies municipales, et fait de la sécurité de l’information une mission organisationnelle centrale.","NIS2 指令提高了对关键和重要实体运营者以及市政公用事业企业的网络安全要求，使信息安全成为一项核心组织任务。"],"Im Bereich Elektrosicherheit berät Phoenix Contact zu VDE-Normen und unterstützt beim rechtssicheren Aufbau der Organisation. Darüber hinaus werden Prüfungen und Messungen durchgeführt sowie Unterweisungen der Mitarbeitenden angeboten.":["In the field of electrical safety, Phoenix Contact advises on VDE standards and supports the legally compliant setup of the organization. Inspections and measurements are also carried out and employee instruction is offered.","En el ámbito de la seguridad eléctrica, Phoenix Contact asesora sobre normas VDE y ayuda a estructurar la organización con seguridad jurídica. Además, se realizan inspecciones y mediciones y se ofrece instrucción a los empleados.","Dans le domaine de la sécurité électrique, Phoenix Contact conseille sur les normes VDE et accompagne la mise en place d’une organisation juridiquement sûre. Des contrôles et mesures sont également réalisés et des formations des collaborateurs proposées.","在电气安全领域，Phoenix Contact 提供 VDE 标准咨询，并协助建立合法合规的组织架构。此外还提供检验和测量以及员工安全培训。"],"Der 360°-Industrial-Security-Ansatz betrachtet die drei Aspekte Menschen, Prozesse und Technologie. Ziel ist eine Anlage, die ganzheitlich gegen Cyberangriffe gesichert ist; Grundlage ist der Security-Standard IEC 62443.":["The 360° industrial security approach considers three aspects: people, processes and technology. The goal is a system that is holistically protected against cyberattacks, based on the IEC 62443 security standard.","El enfoque de seguridad industrial 360° contempla tres aspectos: personas, procesos y tecnología. El objetivo es una instalación protegida de forma integral frente a ciberataques, basada en la norma de seguridad IEC 62443.","L’approche de sécurité industrielle à 360° considère trois aspects : les personnes, les processus et la technologie. L’objectif est une installation protégée de manière globale contre les cyberattaques, sur la base de la norme de sécurité IEC 62443.","360° 工业安全方法涵盖人员、流程和技术三个方面，目标是使设备全面抵御网络攻击，其基础是安全标准 IEC 62443。"],"Wenn der Arbeitsschutz für mehrere Maschinen sichergestellt werden soll, inspiziert das Experten-Team auch ganze Maschinenparks. Auf Basis der Ergebnisse wird eine passende übergreifende Lösung entwickelt.":["When occupational safety needs to be ensured for multiple machines, the expert team also inspects entire machine fleets. Based on the results, a suitable overarching solution is developed.","Cuando debe garantizarse la seguridad laboral en varias máquinas, el equipo de expertos inspecciona también parques de máquinas completos. A partir de los resultados se desarrolla una solución global adecuada.","Lorsque la sécurité au travail doit être garantie pour plusieurs machines, l’équipe d’experts inspecte également des parcs de machines entiers. Sur la base des résultats, une solution globale adaptée est élaborée.","当需要确保多台机器的职业安全时，专家团队也可对整个机群进行检查，并根据结果制定合适的整体解决方案。"],"Konfiguratoren, die anhand technischer Daten den passenden Überspannungsschutz für Stromversorgung, MSR-Technik, Informationstechnik sowie Sende- und Empfangsanlagen vorschlagen.":["Configurators that use technical data to suggest suitable surge protection for power supply, I&C technology, information technology, and transmitting and receiving systems.","Configuradores que, a partir de datos técnicos, proponen la protección contra sobretensiones adecuada para alimentación eléctrica, técnica de medición y control, tecnología de la información e instalaciones de emisión y recepción.","Configurateurs qui, à partir de données techniques, proposent la protection contre les surtensions adaptée pour l’alimentation électrique, l’instrumentation et le contrôle-commande, les technologies de l’information et les installations d’émission et de réception.","根据技术数据为供电、测控技术、信息技术以及收发设备推荐合适浪涌保护的配置器。"],"Für Reparaturen, Rücksendungen, Reklamationen und die Rücknahme von Altgeräten gibt es eigene Anfragewege. Für eine Rücksendung gegen Gutschrift gelten diese Konditionen:":["There are dedicated request channels for repairs, returns, complaints and the take-back of old devices. The following conditions apply to returns for credit:","Para reparaciones, devoluciones, reclamaciones y la recogida de aparatos usados existen canales de solicitud específicos. Para una devolución con abono se aplican estas condiciones:","Des canaux de demande dédiés existent pour les réparations, retours, réclamations et la reprise d’appareils usagés. Les conditions suivantes s’appliquent aux retours avec avoir :","维修、退货、投诉及旧设备回收均有专门的申请渠道。退货换取贷记适用以下条件："],"Tauchen Sie ein in die Welt des Niagara Frameworks! Phoenix Contact bietet Ihnen ein praxisorientiertes Trainingsformat – abgestimmt auf Ihre Ziele und Vorkenntnisse!":["Dive into the world of the Niagara Framework! Phoenix Contact offers you a practice-oriented training format – tailored to your goals and prior knowledge!","¡Sumérjase en el mundo de Niagara Framework! Phoenix Contact le ofrece un formato de formación orientado a la práctica, ¡adaptado a sus objetivos y conocimientos previos!","Plongez dans l’univers du Niagara Framework ! Phoenix Contact vous propose un format de formation axé sur la pratique – adapté à vos objectifs et à vos connaissances préalables !","深入了解 Niagara Framework 的世界！Phoenix Contact 为您提供注重实践的培训形式——根据您的目标和已有知识量身定制！"],"Lernen Sie die Thematiken Gefährdungsbeurteilung nach Betriebssicherheitsverordnung und Risikobeurteilung nach Maschinenrichtline und deren Unterschiede kennen.":["Learn about hazard assessment according to the German Industrial Safety Regulation and risk assessment according to the Machinery Directive, and the differences between them.","Conozca la evaluación de peligros según el Reglamento alemán de seguridad industrial y la evaluación de riesgos según la Directiva de máquinas, así como sus diferencias.","Découvrez l’évaluation des dangers selon le règlement allemand sur la sécurité d’exploitation et l’appréciation des risques selon la directive Machines, ainsi que leurs différences.","了解依据德国《工业安全条例》进行的危险评估和依据《机械指令》进行的风险评估，以及两者之间的区别。"],"Phoenix
