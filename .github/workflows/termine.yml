# Termine aktualisieren – Workflow (JSON-Schreibweise, Einrückung egal)
{
 "name": "Termine aktualisieren",
 "on": {
  "schedule": [
   {
    "cron": "23 3 * * *"
   }
  ],
  "workflow_dispatch": {}
 },
 "permissions": {
  "contents": "write"
 },
 "concurrency": {
  "group": "termine",
  "cancel-in-progress": false
 },
 "jobs": {
  "termine": {
   "runs-on": "ubuntu-latest",
   "timeout-minutes": 15,
   "env": {
    "APP_DIR": "."
   },
   "steps": [
    {
     "uses": "actions/checkout@v4"
    },
    {
     "uses": "actions/setup-python@v5",
     "with": {
      "python-version": "3.12"
     }
    },
    {
     "name": "Termine abrufen (direkt)",
     "id": "plain",
     "continue-on-error": true,
     "run": "python scripts/termine.py \"$APP_DIR/termine.json\""
    },
    {
     "name": "Browser installieren (nur falls der direkte Abruf blockiert wurde)",
     "if": "steps.plain.outcome == 'failure'",
     "run": "pip install playwright==1.47.0\npython -m playwright install --with-deps chromium\n"
    },
    {
     "name": "Termine abrufen (über Browser)",
     "if": "steps.plain.outcome == 'failure'",
     "run": "python scripts/termine.py \"$APP_DIR/termine.json\" --browser"
    },
    {
     "name": "Änderungen speichern",
     "run": "git config user.name \"termine-bot\"\ngit config user.email \"termine-bot@users.noreply.github.com\"\ngit add \"$APP_DIR/termine.json\"\nif git diff --cached --quiet; then\n  echo \"Keine Änderungen.\"\nelse\n  git commit -m \"Termine aktualisiert ($(date +%d.%m.%Y))\"\n  git push\nfi\n"
    }
   ]
  }
 }
}
